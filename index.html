function archiveBack(){
  if(!S.realData) return;
  S.data=S.realData; S.realData=null; S.viewYear=null; S.viewFromFile=false;
  S.page='home'; S.classId=null; S.progClass=null; S.chkClass=null; S.chkId=null; S.asId=null; S.seatClass=null;
  renderShell(); liveFlush();
}
let revertT=null;
function archiveRevert(){
  // 지난 학년도 화면에서 무언가 고치려 하면 원래대로 되돌림
  clearTimeout(revertT);
  revertT=setTimeout(()=>{
    const a=S.viewFromFile?S.fileArchive:(S.realData.archives.find(x=>x.year===S.viewYear));
    if(!a) return archiveBack();
    const keep={page:S.page,classId:S.classId,progClass:S.progClass,chkClass:S.chkClass,chkId:S.chkId,asId:S.asId,seatClass:S.seatClass,recF:S.recF};
    const R=S.realData, v=clone(a.data);
    S.data={...R, ...v, settings:{...R.settings, periods:v.periods||R.settings.periods, praiseOn:false}, archives:R.archives, year:a.year}; delete S.data.periods;
    Object.assign(S,keep); $('#modal-root').innerHTML=''; renderShell();
    toast('지난 학년도 자료는 고칠 수 없습니다. (보기 전용)');
  },30);
}

      <p class="muted">가져가지 않는 것: 학생 명단, 진도, 누가기록, 과제·준비물, 수행평가, 자리배치, 칭찬 점수, 시간표 → 모두 ${D.year}학년도 보관함에 남습니다.</p>

      out={y,keepClasses:q('cls').checked};return true;}});
  if(r.value!=='ok') return;

  const data={}; YEAR_KEYS.forEach(k=>data[k]=clone(D[k])); data.periods=clone(D.settings.periods);

async function exportYear(year,andDelete){
  const D=S.data, a=D.archives.find(x=>x.year===year); if(!a) return;
  const payload={kind:'archive',year:a.year,archivedAt:a.archivedAt,data:a.data,updatedAt:Date.now()};
  let ok=false;
  try{ ok=await saveFile(JSON.stringify(await seal(payload,S.key,S.salt,S.iter)),`전담수업노트-${a.year}학년도-보관.tdata`,`jeondam-archive-${a.year}.tdata`); }catch(e){ console.error(e); }
  if(!ok) return;
  if(!andDelete) return toast('보관 파일을 저장했습니다.');
  if(!await confirmModal('앱에서 삭제',`<p>보관 파일을 저장했습니다. 이제 앱에서 <b>${a.year}학년도</b> 자료를 지울까요?</p><p class="muted">나중에 <b>보관 파일 열어보기</b>로 그 파일을 열어 볼 수 있습니다. 파일은 지금 비밀번호로 잠겨 있습니다.</p>`,'앱에서 삭제',true)) return;
  D.archives=D.archives.filter(x=>x!==a); touch(); renderShell(); toast(`${a.year}학년도 자료를 앱에서 지웠습니다.`);
}
async function openArchiveFile(){
  const file=await pickFileInput('.tdata'); if(!file) return;
  if(file.size>30*1024*1024) return alertModal('파일 오류','<p>파일이 너무 큽니다.</p>');
  const env=parseEnvText(await file.text());
  if(!env) return alertModal('파일 오류','<p>전담 수업 노트에서 만든 파일(.tdata)이 아닙니다.</p>');
  let data=null;
  if(sameKdf(env)){ try{ data=await openEnv(env,S.key); }catch{} }
  if(!data){ const r=await askEnvPassword(env,'보관 파일 비밀번호','이 파일을 만들 때 쓴 비밀번호를 입력하세요.'); if(!r) return; data=r.data; }
  if(!data||data.kind!=='archive') return alertModal('보관 파일이 아닙니다','<p>이 파일은 학년도 보관 파일이 아닙니다. 백업 파일이라면 <b>백업 파일 불러오기</b>를 이용해 주세요.</p>');
  openArchiveData(data);
}
function openArchiveData(data){
  const n=normalize({...data.data,settings:{periods:data.data&&data.data.periods},archives:undefined}), d={}; YEAR_KEYS.forEach(k=>d[k]=n[k]); d.periods=n.settings.periods;
  S.fileArchive={year:parseInt(data.year,10)||0,archivedAt:+data.archivedAt||0,data:d};
  archiveView(S.fileArchive,true);
  toast(`${S.fileArchive.year}학년도 보관 파일을 열었습니다. (보기 전용)`);
}

    const r=await openModal({title:'오늘의 학습 목표',body:`<textarea name="g" maxlength="300" placeholder="예) 출신 국가를 묻고 답할 수 있다.">${esc(c.goal||'')}</textarea>`,
      buttons:[{label:'취소'},{label:'저장',value:'ok',cls:'primary'}],onAction:(x,root)=>{v=root.querySelector('[name=g]').value.trim().slice(0,300);return true;}});
    if(r.value!=='ok')return;c.goal=v;commit({k:'goal',cid:c.id,v});renderDisplayMain();},
  'prog-class':t=>{S.progClass=t.dataset.id;renderMain();},
  'prog-cell':t=>{const c=getClass(S.progClass);if(!c)return;const p=+t.dataset.p,lg=latestLog(c.id,t.dataset.u,p);lg?lessonModal(c,{},lg):lessonModal(c,{unitId:t.dataset.u,period:p});},
  'lesson-add':t=>lessonModal(getClass(t.dataset.id||S.progClass)),
  'lesson-edit':t=>{const l=S.data.lessons.find(x=>x.id===t.dataset.id);if(l)lessonModal(getClass(l.classId),{},l);},
  'goto-progress':t=>{S.page='progress';S.progClass=t.dataset.id;S.classId=null;renderShell();window.scrollTo(0,0);},
  'goto-records':t=>{S.page='records';S.recF={classId:t.dataset.id,studentId:'',tag:'',q:''};S.classId=null;renderShell();window.scrollTo(0,0);},
  'class-edit-id':t=>{const c=getClass(t.dataset.id);if(c)classModal(c);},
  'rec-add':t=>recordModal({classId:t.dataset.id||'',studentIds:t.dataset.sid?[t.dataset.sid]:[]}),
  'rec-edit':t=>{const r=S.data.records.find(x=>x.id===t.dataset.id);if(r)recordModal({existing:r});},
  'rec-student':t=>{S.recF.studentId=t.dataset.sid||'';renderMain();window.scrollTo(0,0);},
  'rec-clear':()=>{S.recF={classId:'',studentId:'',tag:'',q:''};renderMain();},
  'rec-copy':()=>copyStudentRecords(),
  'rec-tags':()=>editTags(),
  'tb-select':t=>{S.tbId=t.dataset.id;renderMain();},
  'tb-new':()=>newTextbookModal(),
  'tb-copy':async()=>{const tb=curTB();if(!tb)return;const n=await tbNameModal('복사본 만들기',tb.name+' (복사본)');if(!n)return;
    const nt={id:uid(),name:n,preset:false,units:tb.units.map(u=>({...u,id:uid()}))};S.data.textbooks.push(nt);S.tbId=nt.id;touch();renderMain();},
  'tb-del':async()=>{const tb=curTB();if(!tb)return;const us=tbUsers(tb),nl=tbLessonCount(tb);
    if(!await confirmModal('단원 목록 삭제',`<p><b>${esc(tb.name)}</b>을(를) 삭제할까요?</p>${us.length?`<p>이 목록을 쓰는 반(${us.map(c=>esc(cname(c))).join(', ')})은 '목록 없음'이 되고${nl?`, 진도 기록 ${nl}건도 삭제됩니다`:''}.</p>`:''}`,'삭제',true))return;
    tbRemoveLessons(tb,new Set(tb.units.map(u=>u.id)));us.forEach(c=>c.textbookId='');S.data.textbooks=S.data.textbooks.filter(x=>x!==tb);S.tbId=null;touch();renderMain();},
  'tb-export':async()=>{const tb=curTB();if(!tb)return;
    const txt=JSON.stringify({app:APP_ID,kind:'textbook',format:1,textbook:{name:tb.name,units:tb.units.map(u=>({label:u.label,title:u.title,periods:u.periods}))}},null,2);
    try{if(await saveFile(txt,`단원목록-${tb.name.replace(/[\\/:*?"<>|]/g,'_')}.json`,'textbook.json',JSON_TYPES))toast('단원 목록 파일을 저장했습니다.');}catch(e){console.error(e);}},
  'tb-import':async()=>{
    const r=await openModal({title:'공유받은 파일 가져오기',
      body:`<p>동료 선생님이 이 앱의 <b>공유용 파일로 저장</b>으로 만든 <b>단원 목록 파일</b>을 불러옵니다.</p>
        <ul class="plain"><li>파일 이름은 보통 <b>단원목록-○○.json</b> 입니다. (.json은 내용을 글자로 담아 두는 일반적인 파일 형식입니다)</li>
        <li>불러오면 단원 이름과 차시가 그대로 새 목록으로 추가됩니다. 지금 있는 목록은 바뀌지 않습니다.</li></ul>
        <p class="muted" style="margin-top:10px">받은 파일이 없나요? 교과서 목차를 직접 넣으려면 목록을 연 뒤 <b>목차 한꺼번에 넣기</b>로 붙여넣는 것이 가장 쉽습니다.</p>`,
      buttons:[{label:'취소'},{label:'파일 고르기',value:'ok',cls:'primary'}]});
    if(r.value==='ok') importTextbook();},
  'unit-add':()=>{const tb=curTB();if(!tb)return;const last=tb.units[tb.units.length-1];
    tb.units.push({id:uid(),label:(tb.units.length+1)+'단원',title:'',periods:last?Math.max(last.periods,1):6});tb.preset=false;touch();renderMain();
    const ins=document.querySelectorAll('[data-k=title]');if(ins.length)ins[ins.length-1].focus();},
  'unit-move':t=>{const tb=curTB();if(!tb)return;const i=tb.units.findIndex(u=>u.id===t.dataset.uid),j=i+(+t.dataset.d);
    if(i<0||j<0||j>=tb.units.length)return;[tb.units[i],tb.units[j]]=[tb.units[j],tb.units[i]];touch();renderMain();},
  'unit-del':async t=>{const tb=curTB();if(!tb)return;const u=tb.units.find(x=>x.id===t.dataset.uid);if(!u)return;const nl=tbLessonCount(tb,new Set([u.id]));
    if(!await confirmModal('단원 삭제',`<p><b>${esc(unitName(u))}</b> 단원을 삭제할까요?${nl?` <b>이 단원의 진도 기록 ${nl}건도 함께 삭제됩니다.</b>`:''}</p>`,'삭제',true))return;
    tbRemoveLessons(tb,new Set([u.id]));tb.units=tb.units.filter(x=>x!==u);touch();renderMain();},
  'unit-paste':()=>{const tb=curTB();if(tb)unitPasteModal(tb);},
  'wipe':()=>wipeAll()
};
const CHG = {
  'stu-no':t=>{const c=getClass(S.classId),s=c&&c.students.find(x=>x.id===t.dataset.sid);if(!s)return;
    const n=parseInt(t.value,10);if(!(n>=1&&n<=99)){t.value=s.no;return;}
    if(c.students.some(x=>x!==s&&x.no===n))toast(`${n}번이 이미 있습니다. 번호를 확인해 주세요.`);
    s.no=n;touch();renderMain();},
  'stu-name':t=>{const c=getClass(S.classId),s=c&&c.students.find(x=>x.id===t.dataset.sid);if(!s)return;
    const v=t.value.trim().slice(0,MAX_NAME);if(!v){t.value=s.name;return;}s.name=v;touch();},
  'stu-g':t=>{const c=getClass(S.classId),s=c&&c.students.find(x=>x.id===t.dataset.sid);if(!s)return;s.g=t.value==='m'||t.value==='f'?t.value:'';touch();},
  'stu-left':t=>{const c=getClass(S.classId),s=c&&c.students.find(x=>x.id===t.dataset.sid);if(!s)return;
    s.left=t.checked;t.closest('tr').classList.toggle('left',s.left);touch();},
  'tt':t=>{const k=t.dataset.key;if(t.value&&getClass(t.value))S.data.timetable[k]=t.value;else delete S.data.timetable[k];touch();renderMain();},
  'ptime':t=>{const p=S.data.settings.periods[+t.dataset.i];let raw=t.value.trim().replace(/[.\s]/g,':');
    if(/^\d{3,4}$/.test(raw))raw=raw.slice(0,-2)+':'+raw.slice(-2);
    const m=raw.match(/^(\d{1,2}):(\d{2})$/);const v=m?validTime(pad(+m[1])+':'+m[2]):null;if(v)t.value=v;if(!p||!v){if(p)t.value=p[t.dataset.k];return;}p[t.dataset.k]=v;touch();},
  'pcount':async t=>{const n=+t.value, ps=S.data.settings.periods;
    if(n<ps.length){const lost=Object.keys(S.data.timetable).filter(k=>+k.split('-')[1]>n);
      if(lost.length&&!await confirmModal('교시 줄이기',`<p>${n+1}교시 이후에 배정된 ${lost.length}칸이 지워집니다. 계속할까요?</p>`,'줄이기',true)){t.value=ps.length;return;}
      lost.forEach(k=>delete S.data.timetable[k]);ps.length=n;}
    else while(ps.length<n){const last=ps[ps.length-1]||{e:'08:50'};const s=addMin(last.e,10);ps.push({s,e:addMin(s,40)});}
    touch();renderMain();},
  'praise-on':t=>{S.data.settings.praiseOn=t.checked;touch();},
  'pr-teams':t=>{const c=getClass(S.classId);if(!c)return;const tm=teamsOf(c);tm.n=Math.min(8,Math.max(2,+t.value));teamsOf(c);touch();renderMain();},
  'as-note':t=>{const a=S.data.assessments.find(x=>x.id===S.asId);if(!a)return;const sid=t.dataset.sid,r=a.results[sid]||{level:'',note:''};
    r.note=t.value.trim().slice(0,200);if(r.level||r.note)a.results[sid]=r;else delete a.results[sid];touch();},
  'year-view':t=>{const v=t.value;if(!v)return archiveBack();const a=(S.realData||S.data).archives.find(x=>x.year===+v);if(a)archiveView(a);},
  'reminder':t=>{S.data.settings.backupReminderDays=+t.value;touch();},
  'seat-mix':t=>{const c=getClass(S.seatClass);if(!c)return;const st=seatingOf(c);st.mixGender=t.checked;touch();
    if(t.checked&&!c.students.some(s=>!s.left&&s.g))alertModal('성별 정보가 없습니다','<p>남녀 섞기를 쓰려면 <b>학급 관리 → 학생 명단</b>에서 성별(남/여)을 넣어 주세요.</p>');},
  'seat-type':t=>{const c=getClass(S.seatClass);if(!c||!LAYOUTS[t.value])return;seatingOf(c).type=t.value;touch();renderMain();},
  'seat-rows':t=>{const c=getClass(S.seatClass);if(!c)return;const st=seatingOf(c),n=parseInt(t.value,10);if(!(n>=1&&n<=10)){t.value=st.rows;return;}resizeSeating(c,n,st.cols);},
  'seat-cols':t=>{const c=getClass(S.seatClass);if(!c)return;const st=seatingOf(c),n=parseInt(t.value,10);if(!(n>=1&&n<=12)){t.value=st.cols;return;}resizeSeating(c,st.rows,n);},
  'd-class':t=>{if(getClass(t.value)){S.display.classId=t.value;renderDisplay();}},
  'd-pcount':t=>{S.display.pick.count=+t.value;},
  'd-pex':t=>{S.display.pick.exclude=t.checked;renderDisplayMain();},
  'd-tsound':t=>{S.display.timer.sound=t.checked;},
  'd-gmix':t=>{S.display.groups.mix=t.checked;},
  'd-gmode':t=>{S.display.groups.mode=t.value;},
  'd-gn':t=>{const n=parseInt(t.value,10);if(n>=1&&n<=20)S.display.groups.n=n;else t.value=S.display.groups.n;},
  'class-memo':t=>{const c=getClass(S.classId);if(!c)return;c.memo=t.value.slice(0,500);touch();},
  'rec-f':t=>{const k=t.dataset.k;S.recF[k]=t.value;if(k==='classId')S.recF.studentId='';renderMain();},
  'tb-name':t=>{const tb=curTB();if(!tb)return;const v=t.value.trim().slice(0,60);if(!v){t.value=tb.name;return;}tb.name=v;touch();},
  'unit-f':t=>{const tb=curTB(),u=tb&&tb.units.find(x=>x.id===t.dataset.uid);if(!u)return;const k=t.dataset.k;
    if(k==='periods'){const n=parseInt(t.value,10);if(!(n>=0&&n<=40)){t.value=u.periods;return;}u.periods=n;}
    else u[k]=t.value.trim().slice(0,k==='label'?30:100);
    tb.preset=false;touch();},
  'autolock':t=>{S.data.settings.autoLockMin=+t.value;touch();}
};
const SUBMITS = {'setup-form':submitSetup,'unlock-form':submitUnlock,'stu-add':addStudent};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||!$('#app').contains(t))return;const fn=ACTS[t.dataset.act];if(fn){e.preventDefault();fn(t,e);}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');if(!t||!$('#app').contains(t)||!S.data)return;const fn=CHG[t.dataset.change];if(fn)fn(t,e);});
let boardT=null;
document.addEventListener('input',e=>{
  if(e.target.id!=='board-memo'||!S.display) return;
  const c=dispClass(); if(!c) return;
  c.board=e.target.value.slice(0,2000);
  clearTimeout(boardT); boardT=setTimeout(()=>commit({k:'board',cid:c.id,v:c.board}),400);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='t-min'||e.target.id==='t-sec')&&S.display){e.preventDefault();ACTS['d-tcustom']();}});
document.addEventListener('submit',e=>{e.preventDefault();const fn=SUBMITS[e.target.id];if(fn)fn(e.target);});

/* ---------- 시작 ---------- */
(async function boot(){
  if(IS_STUDENT) return studentBoot();
  const fail=msg=>{$('#app').innerHTML=`<div class="center-wrap"><div class="auth card"><h1>열 수 없습니다</h1><p>${msg}</p></div></div>`;};
  if(!window.crypto||!crypto.subtle||!window.indexedDB) return fail('이 브라우저는 암호화 기능을 지원하지 않습니다. 최신 <b>크롬</b> 또는 <b>엣지</b>에서 열어 주세요.');
  try{ await DB.open(); }catch(e){ return fail('브라우저 저장소를 열 수 없습니다. 시크릿(InPrivate) 창이 아닌 일반 창에서 열어 주세요.'); }
  await Sync.load();
  const env=await DB.get('envelope');
  if(env && validEnv(env)) renderLock(); else renderSetup();
  // 1분마다 '오늘' 화면의 현재 교시 표시 갱신
  setInterval(()=>{ if(S.data && !S.display && S.page==='home' && !document.querySelector('.modal-back')) renderMain(); },60000);
})();
</script>
