<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 보안: 외부 서버와의 모든 통신(fetch, 이미지, 스크립트, 폰트 등)을 차단합니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>전담 수업 노트</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#1c2333; --muted:#5d6678; --line:#dde2ea;
  --primary:#2b59c3; --primary-ink:#ffffff; --primary-soft:#e8eefb;
  --danger:#c92a4b; --danger-soft:#fdecef; --warn:#a15c00; --warn-soft:#fff4dc;
  --ok:#2b8a3e; --side:#1e2a45; --side-ink:#c9d1e3;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Pretendard','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 12px;letter-spacing:-.01em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.err{color:var(--danger);font-size:14px;min-height:1.4em;margin:6px 0 0}

/* layout */
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:19px;padding:0 10px 18px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--side-ink)}
.nav-btn{display:block;width:100%;padding:13px 14px;border-radius:10px;color:var(--side-ink);background:none;border:0;text-align:left;cursor:pointer;min-height:50px;font-size:17px}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.on{background:#34477a;color:#fff;font-weight:700}
.side-foot{margin-top:auto;font-size:13px;color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:0 6px}
.side-foot .st{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#7c8aa8;display:inline-block}
.dot.ok{background:#51cf66}.dot.warn{background:#fcc419}.dot.bad{background:#ff6b6b}
.btn.lock-btn{margin-top:8px;background:#34477a;color:#fff;border:0}
.btn.lock-btn:hover{background:#40568f}
main{padding:30px 36px 60px;max-width:1120px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head-actions,.btn-row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}
  .brand{padding:0 8px 0 4px;width:100%;margin-bottom:6px}
  .brand small{display:none}
  nav{display:flex;flex-wrap:wrap;gap:4px}
  .nav-btn{width:auto;min-height:44px;padding:8px 12px;font-size:15px}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center;flex-wrap:wrap}
  .btn.lock-btn{margin-top:0}
  main{padding:18px 16px 40px}
}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{margin:0}
.card.empty{color:var(--muted);text-align:center;padding:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:#f3f5f9}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:#244bab}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#ad2240}
.btn.danger-outline{color:var(--danger);border-color:#f0b9c5}
.btn.big{width:100%;min-height:54px;font-size:18px}
.btn:disabled{opacity:.55;cursor:wait}
.link{background:none;border:0;color:var(--primary);cursor:pointer;padding:6px 0;font-weight:600}
.link.small{font-size:14px}
label{display:block}
.field{margin-bottom:14px}
.field>span,.lbl{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=search],input[type=date],input:not([type]),select,textarea{border:1px solid #cdd4df;border-radius:10px;background:#fff;padding:10px 12px;min-height:46px;width:100%}
textarea{resize:vertical;font-family:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #9db6ee;outline-offset:1px;border-color:var(--primary)}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}
.inline{display:flex;align-items:center;gap:10px;font-weight:600}
.inline select{width:auto;min-width:130px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px}
.steps{margin:0 0 16px;padding-left:22px}
.steps li{margin-bottom:6px}
.plain{margin:0;padding-left:20px}
.plain li{margin-bottom:6px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700;background:#eef1f6;border:1px solid var(--c,#999);
  background:color-mix(in srgb,var(--c,#999) 13%,white);border-color:color-mix(in srgb,var(--c,#999) 40%,white);color:color-mix(in srgb,var(--c,#999) 70%,black)}
.chip.big{font-size:24px;padding:6px 18px}
.badge{display:inline-block;background:var(--primary);color:#fff;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:600;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f5d48f}
.banner.danger{background:var(--danger-soft);color:var(--danger);border:1px solid #f0b9c5}
.banner.info{background:var(--primary-soft);color:#1d3f8f;border:1px solid #c5d4f5}
.banner .btn{min-height:40px}

/* home */
.today-list{display:flex;flex-direction:column;gap:8px}
.today-row{display:grid;grid-template-columns:70px 120px 1fr auto;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%;cursor:pointer;min-height:58px}
.today-row:hover{background:#f7f9fc}
.today-row.free{cursor:default;background:#fafbfc;color:var(--muted)}
.today-row.now{border:2px solid var(--primary);background:var(--primary-soft)}
.today-row .period{font-weight:800;font-size:18px}
.today-row .ptime{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:600px){.today-row{grid-template-columns:56px 1fr auto}.today-row .ptime{display:none}}

/* classes */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.class-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border-radius:14px;border:1px solid var(--line);border-top:6px solid var(--c);background:#fff;cursor:pointer;text-align:left;min-height:110px;box-shadow:var(--shadow)}
.class-card:hover{background:#f8fafc}
.cc-name{font-size:24px;font-weight:800}
.cc-meta{color:var(--muted);font-size:14px}
table.grid{width:100%;border-collapse:collapse}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.grid th{font-size:14px;color:var(--muted);font-weight:600}
table.stu td:first-child{width:110px}
table.stu td:nth-child(3){width:110px}
table.stu td:last-child{width:90px;text-align:right}
table.stu input{min-height:42px;border-color:transparent;background:transparent}
table.stu input:hover{border-color:#cdd4df;background:#fff}
table.stu input:focus{background:#fff}
table.stu tr.left input[type=text],table.stu tr.left input[type=number]{color:#9aa3b2;text-decoration:line-through}
.add-row{display:flex;gap:8px;margin-top:14px}
.add-row input[name=no]{max-width:110px}
.add-row input[name=name]{max-width:260px}
.icon-btn{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;border-radius:8px;padding:8px 10px;min-height:42px}
.icon-btn:hover{border-color:#f0b9c5;color:var(--danger);background:var(--danger-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{display:block;width:40px;height:40px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span{outline:3px solid #9db6ee}
.preview{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.preview table{width:100%;border-collapse:collapse;font-size:14px}
.preview td,.preview th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.preview .bad{color:var(--danger)}

/* timetable */
.tt-wrap{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:6px;width:100%;min-width:640px}
table.tt th{font-size:15px;color:var(--muted);font-weight:700;text-align:center;padding:4px}
table.tt th.pcell{text-align:left;width:150px}
.pnum{font-size:17px;color:var(--ink);font-weight:800}
.ptimes{display:flex;align-items:center;gap:2px}
.ptimes input{min-height:36px;padding:2px 6px;font-size:14px;width:64px;text-align:center;font-variant-numeric:tabular-nums}
td.tcell{border-radius:12px;background:#f1f3f7;padding:0}
td.tcell.filled{background:color-mix(in srgb,var(--c) 18%,white);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,white)}
td.tcell select{border:0;background:transparent;min-height:58px;text-align:center;font-weight:700;font-size:17px;cursor:pointer;text-align-last:center}
.tt-sum{display:flex;flex-wrap:wrap;gap:8px}

/* auth */
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth{width:100%;max-width:480px}
.auth-brand{font-weight:800;color:var(--primary);margin-bottom:6px}
.auth h1{margin-bottom:10px}
.auth .sep{border:0;border-top:1px solid var(--line);margin:22px 0}
.notice{background:var(--primary-soft);color:#1d3f8f;border-radius:10px;padding:10px 14px;font-size:15px}
.warnbox{background:var(--warn-soft);color:#6b4100;border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:14px}

/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(15,22,38,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{font-size:21px}
.modal-body{margin:6px 0 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;pointer-events:none}
.toast{background:#1c2333;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
.danger-zone{border-color:#f0b9c5}


/* ---- 3단계: 자리배치 ---- */
.nav-btn.disp-btn{margin-top:10px;border:1px dashed #6b7fae;color:#fff}
.seat-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.seat-tools label{font-size:14px;font-weight:600;color:var(--muted)}
.seat-tools select,.seat-tools input{margin-top:4px;width:150px;color:var(--ink)}
.seat-tools input{width:110px}
.seat-count{align-self:center}
.seat-wrap{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:start}
.seat-main{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);overflow-x:auto}
.seat-board{--aisle:26px;--seatw:128px;--rowgap:14px;width:max-content;max-width:100%;margin:0 auto}
.board-bar{background:#2f4f3a;color:#e6f2ea;text-align:center;font-weight:700;border-radius:8px;padding:8px;margin:0 8% 22px;letter-spacing:.2em}
.seat-grid+.board-bar{margin:22px 8% 0}
.seat-grid{display:grid;column-gap:6px;row-gap:var(--rowgap);justify-content:center}
.seat{min-height:62px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center;padding:6px 4px;line-height:1.2;user-select:none;-webkit-user-select:none}
.seat.filled{background:#fff;border:2px solid color-mix(in srgb,var(--c,#2b59c3) 45%,white);box-shadow:0 1px 2px rgba(0,0,0,.06)}
#seat-area .seat.filled,#seat-area .wcard{cursor:grab;touch-action:none}
.seat.empty{background:#f3f5f8;border:2px dashed #d5dbe5;color:#a0a8b6;font-size:13px}
.seat.nodesk{background:transparent;border:2px dotted transparent}
.desk-edit .seat{cursor:pointer}
.desk-edit .seat.nodesk{border-color:#d5dbe5;background:repeating-linear-gradient(45deg,#f6f7f9,#f6f7f9 6px,#eceff4 6px,#eceff4 12px)}
.seat.locked{border-color:var(--warn);background:#fff8e6}
.seat.sel,.wcard.sel{outline:4px solid var(--primary);outline-offset:1px}
.seat.over{outline:4px dashed var(--primary);outline-offset:1px}
.seat.dragging,.wcard.dragging{opacity:.35}
.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:rotate(-2deg)}
.sno{font-size:12px;color:var(--muted);font-weight:700}
.sname{font-size:17px;font-weight:800}
.pin{position:absolute;top:3px;right:3px;font-size:12px;border:1px solid #cdd4df;background:#fff;color:var(--muted);border-radius:6px;padding:2px 6px;cursor:pointer;display:none}
.seat.sel .pin,.seat.locked .pin{display:block}
@media (hover:hover){.seat.filled:hover .pin{display:block}}
.seat.locked .pin{background:var(--warn);border-color:var(--warn);color:#fff}
.seat-board.big .seat.locked{border-color:color-mix(in srgb,var(--c,#2b59c3) 45%,white);background:#fff}
.seat:hover .pin{color:var(--ink)}
.wait{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-height:160px}
.wait.over{outline:4px dashed var(--primary)}
.wait h3{margin:0 0 10px;font-size:16px}
.wait-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wcard{border:2px solid #cdd4df;border-radius:10px;background:#fff;padding:6px;text-align:center;display:flex;flex-direction:column;user-select:none}
.wcard .sname{font-size:15px}
.hist-row{grid-template-columns:120px 1fr auto 0 auto;align-items:center}
.avoid-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.avoid-list{margin-top:10px;max-height:220px;overflow:auto}
.print-only{display:none}
.theme-pick{display:flex;flex-wrap:wrap;gap:8px}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.g-m{background:#4c7cf0}.g-f{background:#f06595}
.gsel{width:auto!important;min-width:76px}
.mixchk{padding:0 10px;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tpreset{position:relative;display:inline-flex}
.tdel{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#e03131;color:#fff;font-weight:900;cursor:pointer}
.dbtn.cur{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.dbtn.dashed{border-style:dashed;color:var(--muted)}
.tcustom .dnum{width:96px;min-height:58px;font-size:22px;text-align:center}
.d-sep{width:1px;height:40px;background:var(--line,#ddd);margin:0 4px}
@media (max-width:900px){.seat-wrap{grid-template-columns:1fr}}
@media print{
  @page{size:landscape;margin:12mm}
  body{background:#fff}
  .side,.no-print,#toast,.pin{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:none}
  .print-only{display:block;margin-bottom:12px}
  .seat-wrap{display:block}
  .seat-main{border:0;box-shadow:none;padding:0}
  .seat-board{--seatw:150px}
  .seat.filled,.seat.locked{border:1.5px solid #333;box-shadow:none;background:#fff}
  .seat.empty{border:1.5px dashed #999;color:transparent}
  .board-bar{background:#fff;color:#000;border:1.5px solid #000}
}

/* ---- 3단계: 수업 화면 모드 ---- */
.disp{min-height:100vh;display:flex;flex-direction:column;background:#f4f6f9}
.disp-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#16213a;color:#fff;padding:10px 16px;border-bottom:6px solid var(--c)}
.disp-cls{width:auto;min-width:110px;font-size:24px;font-weight:800;background:var(--c);color:#fff;border:0;border-radius:12px;min-height:54px;padding:0 14px}
.disp-tabs{display:flex;gap:6px;flex-wrap:wrap}
.dtab{background:transparent;border:2px solid #3a4a70;color:#d6ddeb;border-radius:12px;min-height:54px;padding:0 20px;font-size:20px;font-weight:700;cursor:pointer}
.dtab.on{background:#fff;color:#16213a;border-color:#fff}
.disp-right{margin-left:auto;display:flex;gap:8px}
.disp-right .dbtn{background:transparent;color:#d6ddeb;border-color:#3a4a70;min-height:46px;font-size:16px}
.mini-timer{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:#ffd43b}
.mini-timer.done{color:#ff6b6b;animation:blink 1s infinite}
.disp-main{flex:1;max-width:none;width:100%;padding:24px clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:18px}
.dbtn{border:2px solid #cdd4df;background:#fff;border-radius:14px;min-height:58px;padding:0 22px;font-size:20px;font-weight:700;cursor:pointer}
.dbtn.big{min-height:78px;padding:0 40px;font-size:28px}
.dbtn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.d-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.dlabel{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.dlabel select,.dlabel .dnum{width:auto;min-height:54px;font-size:20px}
.dlabel .dnum{width:90px}
.dlabel input[type=checkbox]{width:26px;height:26px}
.d-sub{text-align:center;font-size:20px;color:var(--muted)}
.ph{color:#a0a8b6}
.seat-board.big{--aisle:clamp(24px,3vw,56px);--seatw:clamp(120px,11vw,190px);--rowgap:clamp(16px,3.2vh,38px)}
.seat-board.big .seat{min-height:clamp(58px,8.5vh,96px)}
.seat-board.big .sname{font-size:clamp(18px,2.3vw,36px)}
.seat-board.big .sno{font-size:clamp(12px,1.1vw,18px)}
.seat-board.big .board-bar{font-size:20px;padding:10px}
.pick-stage,.timer-stage,.goal-stage{display:flex;flex-direction:column;align-items:center;gap:24px;margin:auto 0}
.pick-out{min-height:34vh;width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 48px;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:24px}
.pname{font-size:clamp(48px,9vw,140px);font-weight:900;color:var(--ink)}
.pname.rolling{color:#9aa3b2}
.pick-out .ph{font-size:clamp(28px,4vw,56px)}
.pick-out.pop .pname{animation:pop .45s ease-out;color:var(--c)}
.picked{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pchip{background:#e6e9f0;border-radius:999px;padding:6px 16px;font-size:20px;font-weight:700}
.timer-digits{font-size:clamp(120px,24vw,340px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.timer-digits.done{color:#e03131;animation:blink 1s infinite}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<noscript>이 앱을 사용하려면 자바스크립트가 필요합니다.</noscript>
<script>
'use strict';
/* =====================================================================
   전담 수업 노트 - 1단계
   - 서버 없음 / 외부 통신 없음 (CSP로 차단)
   - 데이터는 비밀번호에서 만든 키(PBKDF2-SHA256 60만 회)로 AES-256-GCM 암호화 후
     브라우저 IndexedDB에 저장
   - 선택: 클라우드 동기화 폴더의 암호화 파일과 자동 동기화 (File System Access API)
   ===================================================================== */
const APP_ID = 'jeondam-note';
const FORMAT = 1;
const KDF_ITER = 600000;
const MIN_PW = 6;
const MAX_NAME = 20;
const AAD = new TextEncoder().encode('jeondam-note/v1');
const DAYS = ['일','월','화','수','목','금','토'];
const COLORS = ['#e8590c','#2f9e44','#1971c2','#9c36b5','#e03131','#0c8599','#f08c00','#5f3dc4','#c2255c','#66a80f','#495057','#1098ad'];
const FILE_TYPES = [{description:'전담 수업 노트 데이터 (.tdata)', accept:{'application/octet-stream':['.tdata']}}];
const JSON_TYPES = [{description:'교과·단원 파일 (.json)', accept:{'application/json':['.json']}}];
const SKILLS = [['L','듣기'],['S','말하기'],['R','읽기'],['W','쓰기']];
const DEFAULT_TAGS = ['칭찬','학습','태도','과제','상담','기타'];
const DEFAULT_TIMER = [60,120,180,300,600];

/* ---------- 기본 교과서 ---------- */
function presetDongA5(){
  const L = (n,t) => ({label:'Lesson '+n, title:t, periods:6});
  const R = n => ({label:'Review '+n, title:'', periods:1});
  const B = () => ({label:'Board Game', title:'', periods:1});
  const units = [L(1,"I'm from Australia"),L(2,'Whose Sock Is This?'),R(1),
    L(3,'I Get Up at 5'),L(4,'Can I Borrow Your Cap?'),R(2),
    L(5,'My Favorite Subject Is Art'),L(6,"I'll Go Camping"),R(3),B(),
    L(7,'I Went to the Beach'),L(8,'How Much Are These Pants?'),R(4),
    L(9,'What Does He Look Like?'),L(10,'There Is a Bed in the Bedroom'),R(5),
    L(11,'Where Is Happy Park?'),L(12,'I Want to Be a Pilot'),R(6),B()];
  return {id:'tb-donga-5', name:'동아(정은숙) 5학년 영어', preset:true,
    units: units.map((u,i)=>({id:'u'+(i+1), ...u}))};
}
function defaultPeriods(){
  return [['09:00','09:40'],['09:50','10:30'],['10:40','11:20'],['11:30','12:10'],['13:00','13:40'],['13:50','14:30']]
    .map(([s,e])=>({s,e}));
}
function defaultData(){
  const now = Date.now();
  return {schema:1, createdAt:now, updatedAt:now,
    settings:{praiseOn:false, checkSelfTap:true, autoLockMin:10, backupReminderDays:7, lastBackupAt:0, periods:defaultPeriods(), recordTags:DEFAULT_TAGS.slice()},
    classes:[], timetable:{}, textbooks:[presetDongA5()], lessons:[], records:[], checks:[], assessments:[],
    year:schoolYear(), archives:[]};
}
/** 학년도: 3월~다음 해 2월 */
function schoolYear(d=new Date()){ return d.getMonth()>=2?d.getFullYear():d.getFullYear()-1; }
const YEAR_KEYS=['classes','lessons','records','checks','assessments','timetable','textbooks'];

/* ---------- 유틸 ---------- */
const $ = (s,r=document) => r.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
function uid(){return Array.from(rand(9),b=>b.toString(16).padStart(2,'0')).join('');}
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
const pad = n => String(n).padStart(2,'0');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function fmtDT(ts){if(!ts)return '-';const d=new Date(ts);return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fmtHM(ts){const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function ymd(){const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;}
function daysAgo(ts){return Math.floor((Date.now()-ts)/86400000);}
function todayStr(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function validDate(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return null;const [y,m,d]=v.split('-').map(Number);const t=new Date(y,m-1,d);return t.getMonth()===m-1&&t.getDate()===d?v:null;}
function fmtD(v){const [y,m,d]=v.split('-').map(Number);return `${m}/${d}(${DAYS[new Date(y,m-1,d).getDay()]})`;}
const unitName = u => [u.label,u.title].filter(Boolean).join(' ')||'(이름 없음)';
function validTime(t){return typeof t==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t)?t:null;}
function addMin(t,m){const [h,mi]=t.split(':').map(Number);const x=Math.min(h*60+mi+m,23*60+59);return `${pad(Math.floor(x/60))}:${pad(x%60)}`;}

/* ---------- 저장소 (IndexedDB) ---------- */
const DB = {
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('jeondam-note',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('kv',mode);const st=t.objectStore('kv');
    const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  get(k){return this.tx('readonly',s=>s.get(k));},
  set(k,v){return this.tx('readwrite',s=>s.put(v,k));},
  del(k){return this.tx('readwrite',s=>s.delete(k));},
  clear(){return this.tx('readwrite',s=>s.clear());}
};

/* ---------- 암호화 ---------- */
async function derive(pw,salt,iter){
  const base = await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(obj,key,salt,iter){
  const iv = rand(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:AAD},key,enc.encode(JSON.stringify(obj))));
  return {app:APP_ID,format:FORMAT,kdf:{name:'PBKDF2',hash:'SHA-256',iterations:iter,salt:b64(salt)},iv:b64(iv),ct:b64(ct),updatedAt:obj.updatedAt};
}
async function openEnv(env,key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv),additionalData:AAD},key,unb64(env.ct));
  return JSON.parse(dec.decode(pt));
}
function validEnv(e){
  return !!e && typeof e==='object' && e.app===APP_ID && e.format===FORMAT && e.kdf && e.kdf.name==='PBKDF2' && e.kdf.hash==='SHA-256'
    && Number.isInteger(e.kdf.iterations) && e.kdf.iterations>=100000 && e.kdf.iterations<=5000000
    && typeof e.kdf.salt==='string' && typeof e.iv==='string' && typeof e.ct==='string' && typeof e.updatedAt==='number';
}
function parseEnvText(t){try{const e=JSON.parse(t);return validEnv(e)?e:null;}catch{return null;}}
function sealData(){return seal(S.realData||S.data,S.key,S.salt,S.iter);}
function sameKdf(env){return S.salt && env.kdf.salt===b64(S.salt) && env.kdf.iterations===S.iter;}
async function tryEnvWithPassword(env,pw){
  const salt=unb64(env.kdf.salt), iter=env.kdf.iterations;
  const key=await derive(pw,salt,iter);
  const data=await openEnv(env,key);
  return {key,salt,iter,data};
}
function adoptKey(r){S.key=r.key;S.salt=r.salt;S.iter=r.iter;}

/* ---------- 디자인: 한 가지(블루)로 고정 ---------- */
function applyTheme(){ document.documentElement.dataset.theme='blue'; }
applyTheme();
/* ---------- 데이터 정리 (불러온 파일 검증) ---------- */
function normSeating(x){
  if(!x||typeof x!=='object') return null;
  const rows=parseInt(x.rows,10), cols=parseInt(x.cols,10);
  if(!(rows>=1&&rows<=10&&cols>=1&&cols<=12)) return null;
  const n=rows*cols, seats=Array.from({length:n},(_,i)=>{const v=Array.isArray(x.seats)?x.seats[i]:'';return typeof v==='string'?v.slice(0,40):'';});
  const type=['single','pairs','g4','g6'].includes(x.type)?x.type:'pairs';
  const locked=Array.isArray(x.locked)?[...new Set(x.locked.filter(i=>Number.isInteger(i)&&i>=0&&i<n))]:[];
  return {type,rows,cols,seats,locked,mixGender:!!x.mixGender};
}
function normalize(raw){
  const d = defaultData();
  if(!raw || typeof raw!=='object') return d;
  const int=(v,min,max,def)=>{v=parseInt(v,10);return Number.isFinite(v)&&v>=min&&v<=max?v:def;};
  const str=(v,max)=>String(v ?? '').slice(0,max);
  const hex=c=>typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c)?c:COLORS[0];
  const s = raw.settings || {};
  d.createdAt = +raw.createdAt || Date.now();
  d.updatedAt = +raw.updatedAt || Date.now();
  d.settings.autoLockMin = int(s.autoLockMin,0,120,10);
  d.settings.praiseOn = !!s.praiseOn;
  d.settings.checkSelfTap = s.checkSelfTap===undefined?true:!!s.checkSelfTap;
  d.settings.backupReminderDays = int(s.backupReminderDays,0,60,7);
  d.settings.lastBackupAt = +s.lastBackupAt || 0;
  if(Array.isArray(s.recordTags)){const t=[...new Set(s.recordTags.map(x=>str(x,10).trim()).filter(Boolean))].slice(0,12);if(t.length)d.settings.recordTags=t;}
  if(Array.isArray(s.periods) && s.periods.length)
    d.settings.periods = s.periods.slice(0,9).map(p=>({s:validTime(p&&p.s)||'09:00', e:validTime(p&&p.e)||'09:40'}));
  if(Array.isArray(raw.textbooks) && raw.textbooks.length)
    d.textbooks = raw.textbooks.slice(0,50).map(tb=>({id:str(tb&&tb.id,40)||uid(), name:str(tb&&tb.name,60)||'단원 목록', preset:!!(tb&&tb.preset),
      units:Array.isArray(tb&&tb.units)?tb.units.slice(0,200).map(u=>({id:str(u&&u.id,40)||uid(),label:str(u&&u.label,30),title:str(u&&u.title,100),periods:int(u&&u.periods,0,40,6)})):[]}));
  if(Array.isArray(raw.classes))
    d.classes = raw.classes.slice(0,100).map(c=>({id:str(c&&c.id,40)||uid(), grade:int(c&&c.grade,1,6,5), room:int(c&&c.room,1,30,1), color:hex(c&&c.color),
      textbookId:str(c&&c.textbookId,40), memo:str(c&&c.memo,500), goal:str(c&&c.goal,300), board:str(c&&c.board,2000),

  const ids = new Set(d.classes.map(c=>c.id));
  if(raw.timetable && typeof raw.timetable==='object')
    for(const [k,v] of Object.entries(raw.timetable)) if(/^[1-5]-[1-9]$/.test(k) && ids.has(v)) d.timetable[k]=v;
  const stuKeys = new Set(d.classes.flatMap(c=>c.students.map(st=>c.id+'/'+st.id)));
  d.classes.forEach(c=>{c.avoid=c.avoid.filter(([a,b])=>a!==b&&stuKeys.has(c.id+'/'+a)&&stuKeys.has(c.id+'/'+b));});
  const skillKeys = SKILLS.map(x=>x[0]);
  if(Array.isArray(raw.lessons))
    d.lessons = raw.lessons.slice(0,30000).filter(l=>l&&ids.has(l.classId)&&validDate(l.date)).map(l=>({id:str(l.id,40)||uid(),classId:l.classId,date:l.date,
      unitId:str(l.unitId,40),period:int(l.period,1,40,1),skills:Array.isArray(l.skills)?skillKeys.filter(k=>l.skills.includes(k)):[],text:str(l.text,1000),createdAt:+l.createdAt||0}));
  d.classes.forEach(c=>{const ok=new Set(c.students.map(x=>x.id));for(const k of Object.keys(c.praise))if(!ok.has(k)||!c.praise[k])delete c.praise[k];});
  const sidSet = new Map(d.classes.map(c=>[c.id,new Set(c.students.map(x=>x.id))]));
  if(Array.isArray(raw.checks))
    d.checks = raw.checks.slice(0,5000).filter(x=>x&&ids.has(x.classId)&&validDate(x.date)).map(x=>({id:str(x.id,40)||uid(),classId:x.classId,
      kind:CHECK_KINDS.includes(x.kind)?x.kind:'과제',title:str(x.title,60)||'(내용 없음)',date:x.date,
      done:Array.isArray(x.done)?[...new Set(x.done.filter(sid=>sidSet.get(x.classId).has(sid)))]:[],closed:!!x.closed,createdAt:+x.createdAt||0}));
  if(Array.isArray(raw.assessments))
    d.assessments = raw.assessments.slice(0,500).filter(a=>a&&typeof a==='object').map(a=>{
      const scale=SCALES[a.scale]?a.scale:'hml', classIds=Array.isArray(a.classIds)?[...new Set(a.classIds.filter(id=>ids.has(id)))]:[];
      const okS=new Set(classIds.flatMap(id=>[...sidSet.get(id)])), results={};
      if(a.results&&typeof a.results==='object') for(const [sid,r] of Object.entries(a.results)){ if(!okS.has(sid)||!r) continue;
        const level=SCALES[scale].levels.includes(r.level)?r.level:'', note=str(r.note,200); if(level||note) results[sid]={level,note}; }
      return {id:str(a.id,40)||uid(),title:str(a.title,60)||'(이름 없음)',area:AREAS.includes(a.area)?a.area:'기타',standard:str(a.standard,300),
        date:validDate(a.date)||todayStr(),scale,classIds,results,createdAt:+a.createdAt||0};});
  if(Array.isArray(raw.records))
    d.records = raw.records.slice(0,50000).filter(r=>r&&stuKeys.has(r.classId+'/'+r.studentId)&&validDate(r.date)).map(r=>({id:str(r.id,40)||uid(),classId:r.classId,
      studentId:r.studentId,date:r.date,tag:str(r.tag,10)||'기타',text:str(r.text,1000),createdAt:+r.createdAt||0}));
  d.year = int(raw.year,2000,2100,schoolYear(new Date(d.createdAt)));
  d.archives = Array.isArray(raw.archives) ? raw.archives.slice(0,30).filter(a=>a&&a.data&&typeof a.data==='object').map(a=>{
      const n=normalize({...a.data,settings:{periods:a.data.periods},archives:undefined});
      const data={}; YEAR_KEYS.forEach(k=>data[k]=n[k]); data.periods=n.settings.periods;
      return {year:int(a.year,2000,2100,d.year-1),archivedAt:+a.archivedAt||0,data};
    }).sort((x,y)=>y.year-x.year) : [];
  // 다음 단계에서 추가될 항목은 그대로 보존
  for(const k of Object.keys(raw)) if(!(k in d)) d[k]=raw[k];
  return d;
}

/* ---------- 클라우드 폴더 동기화 ---------- */
const Sync = {
  supported: typeof window.showSaveFilePicker==='function' && typeof window.showOpenFilePicker==='function',
  handle:null, ok:false, conflict:false, busy:false, pending:false, msg:'',
  meta:{lastSyncedAt:0},
  async load(){ try{ this.handle=(await DB.get('syncHandle'))||null; this.meta=(await DB.get('syncMeta'))||{lastSyncedAt:0}; }catch{ this.handle=null; } },
  async perm(h,ask){
    const o={mode:'readwrite'};
    try{ let p=await h.queryPermission(o); if(p!=='granted'&&ask) p=await h.requestPermission(o); return p==='granted'; }catch{ return false; }
  },
  async readEnv(){ const f=await this.handle.getFile(); if(f.size>30*1024*1024) return 'invalid'; const t=await f.text(); if(!t.trim()) return null; return parseEnvText(t)||'invalid'; },
  async writeEnv(env){ const w=await this.handle.createWritable(); await w.write(JSON.stringify(env)); await w.close();
    this.meta.lastSyncedAt=env.updatedAt; await DB.set('syncMeta',this.meta); this.msg=''; },
  async setHandle(h){ this.handle=h; this.ok=true; this.conflict=false; await DB.set('syncHandle',h); },
  async unlink(){ this.handle=null; this.ok=false; this.conflict=false; this.meta={lastSyncedAt:0}; await DB.del('syncHandle'); await DB.del('syncMeta'); }
};
async function syncPush(){
  if(!S.data || S.realData || !Sync.handle || !Sync.ok || Sync.conflict) return;
  if(Sync.busy){ Sync.pending=true; return; }
  Sync.busy=true; let needCheck=false;
  try{
    const fe = await Sync.readEnv();
    if(fe && fe!=='invalid' && fe.updatedAt!==Sync.meta.lastSyncedAt && fe.updatedAt!==S.data.updatedAt) needCheck=true;
    else await Sync.writeEnv(await sealData());
  }catch(e){ console.error(e); Sync.ok=false; Sync.msg='동기화 파일에 쓸 수 없습니다'; }
  finally{ Sync.busy=false; renderStatus(); }
  if(needCheck) await syncCheck();
  else if(Sync.pending){ Sync.pending=false; await syncPush(); }
}
async function syncCheck(){
  if(!S.data || S.realData || !Sync.handle || !Sync.ok || Sync.busy) return;
  Sync.busy=true;
  try{
    let fe;
    try{ fe = await Sync.readEnv(); }catch(e){ Sync.ok=false; Sync.msg='동기화 파일을 찾을 수 없습니다'; return; }
    if(fe==='invalid'){ Sync.msg='동기화 파일 형식이 올바르지 않습니다'; return; }
    if(!fe){ await Sync.writeEnv(await sealData()); return; }
    const L=S.data.updatedAt, R=fe.updatedAt, B=Sync.meta.lastSyncedAt;
    const remoteChanged = R!==B && R!==L;
    const localChanged = L!==B;
    if(!remoteChanged){
      if(R===L){ if(B!==L){ Sync.meta.lastSyncedAt=L; await DB.set('syncMeta',Sync.meta); } }
      else if(localChanged) await Sync.writeEnv(await sealData());
      return;
    }
    if(!localChanged){
      if(await loadRemote(fe)){ toast('다른 PC에서 저장한 최신 내용을 불러왔습니다.'); renderShell(); }
      return;
    }
    Sync.conflict=true; renderStatus();
    await resolveConflict(fe);
  }finally{
    Sync.busy=false; renderStatus();
    if(Sync.pending && S.data){ Sync.pending=false; syncPush(); }
  }
}
async function loadRemote(fe){
  let res=null;
  if(sameKdf(fe)){ try{ res={data:await openEnv(fe,S.key)}; }catch{} }
  if(!res){
    res = await askEnvPassword(fe,'동기화 파일 비밀번호',
      '동기화 파일의 비밀번호가 이 PC와 다릅니다. (다른 PC에서 비밀번호를 바꿨을 수 있어요)<br>동기화 파일의 비밀번호를 입력하면, 이 PC도 앞으로 그 비밀번호를 사용합니다.');
    if(!res) return false;
    adoptKey(res);
  }
  S.data = normalize(res.data);
  S.data.updatedAt = fe.updatedAt;
  await DB.set('envelope', await sealData());
  Sync.meta.lastSyncedAt = fe.updatedAt; await DB.set('syncMeta',Sync.meta);
  Sync.conflict=false;
  return true;
}
async function resolveConflict(fe){
  const r = await openModal({title:'동기화 충돌',
    body:`<p>이 PC와 동기화 파일(다른 PC) <b>양쪽 모두에서 내용이 바뀌었습니다.</b></p>
      <ul class="plain"><li>이 PC 마지막 수정: <b>${fmtDT(S.data.updatedAt)}</b></li><li>동기화 파일 마지막 수정: <b>${fmtDT(fe.updatedAt)}</b></li></ul>
      <p style="margin-top:10px">어느 쪽을 사용할까요? <b>선택하지 않은 쪽의 변경 내용은 사라집니다.</b><br><span class="muted">걱정되면 '나중에'를 누르고 먼저 백업 파일을 내보내 두세요.</span></p>`,
    buttons:[{label:'나중에'},{label:'이 PC 내용 사용',value:'local'},{label:'동기화 파일 내용 사용',value:'remote',cls:'primary'}]});
  if(r.value==='remote'){ if(await loadRemote(fe)){ toast('동기화 파일 내용으로 바꿨습니다.'); renderShell(); } }
  else if(r.value==='local'){
    Sync.conflict=false;
    S.data.updatedAt=Math.max(Date.now(),S.data.updatedAt+1,fe.updatedAt+1);
    await DB.set('envelope',await sealData());
    await Sync.writeEnv(await sealData());
    toast('이 PC 내용으로 동기화 파일을 덮어썼습니다.');
    renderShell();
  }
}

/* ---------- 모달 / 알림 ---------- */
function openModal({title,body,buttons,onAction,onOpen}){
  return new Promise(resolve=>{
    const root=document.createElement('div'); root.className='modal-back';
    root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="modal-body">${body}</div>
      <div class="modal-actions">${buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||''}" data-mi="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    $('#modal-root').appendChild(root);
    const first = root.querySelector('input:not([type=radio]):not([type=checkbox]),textarea,select');
    (first||root.querySelector('.modal-actions .btn:last-child')).focus();
    if(onOpen) onOpen(root);
    let working=false;
    const finish=v=>{root.remove();resolve({value:v,root});};
    root.addEventListener('click',async e=>{
      const b=e.target.closest('[data-mi]'); if(!b||working) return;
      const btn=buttons[+b.dataset.mi];
      if(onAction && btn.value!==undefined){
        working=true; root.querySelectorAll('[data-mi]').forEach(x=>x.disabled=true);
        let r; try{ r=await onAction(btn.value,root); }catch(err){ console.error(err); r=false; }
        working=false; root.querySelectorAll('[data-mi]').forEach(x=>x.disabled=false);
        if(r===false) return;
      }
      finish(btn.value===undefined?null:btn.value);
    });
    root.addEventListener('keydown',e=>{
      if(e.key==='Escape' && !working) finish(null);
      if(e.key==='Enter' && e.target.tagName==='INPUT' && e.target.type!=='checkbox'){
        const i=buttons.findIndex(b=>b.cls&&b.cls.split(' ').some(x=>x==='primary'||x==='danger')); if(i>=0){ e.preventDefault(); root.querySelector(`[data-mi="${i}"]`).click(); }
      }
    });
  });
}
async function confirmModal(title,bodyHtml,okLabel,danger){
  const r=await openModal({title,body:bodyHtml,buttons:[{label:'취소'},{label:okLabel,value:'ok',cls:danger?'danger':'primary'}]});
  return r.value==='ok';
}
function alertModal(title,bodyHtml){return openModal({title,body:bodyHtml,buttons:[{label:'확인',value:'ok',cls:'primary'}]});}
async function typedConfirm(title,bodyHtml,word,okLabel){
  const r=await openModal({title,
    body:`${bodyHtml}<label class="field" style="margin-top:14px"><span>확인을 위해 <b>${esc(word)}</b> 라고 입력하세요</span><input type="text" name="w" autocomplete="off"></label><p class="err"></p>`,
    buttons:[{label:'취소'},{label:okLabel,value:'ok',cls:'danger'}],
    onAction:(v,root)=>{ if(root.querySelector('[name=w]').value.trim()!==word){ root.querySelector('.err').textContent='입력한 글자가 맞지 않습니다.'; return false; } return true; }});
  return r.value==='ok';
}
async function askEnvPassword(env,title,msgHtml){
  let result=null;
  const r=await openModal({title,
    body:`<p>${msgHtml}</p><label class="field"><span>비밀번호</span><input type="password" name="pw" autocomplete="off"></label><p class="err"></p>`,
    buttons:[{label:'취소'},{label:'확인',value:'ok',cls:'primary'}],
    onAction:async(v,root)=>{
      const err=root.querySelector('.err'); err.textContent='확인 중…';
      try{ result=await tryEnvWithPassword(env,root.querySelector('[name=pw]').value); return true; }
      catch{ err.textContent='비밀번호가 맞지 않습니다.'; return false; }
    }});
  return r.value==='ok'?result:null;
}
function toast(msg){
  const box=$('#toast'); while(box.children.length>=2) box.firstChild.remove();
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  box.appendChild(el); setTimeout(()=>el.remove(),3500);
}
function pickFileInput(accept){
  return new Promise(resolve=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept=accept;
    inp.onchange=()=>resolve(inp.files&&inp.files[0]||null);
    inp.click();
  });
}
/** 파일 저장: 크롬·엣지는 저장 위치 선택 창, 그 외 브라우저는 다운로드 폴더 */
async function saveFile(text,koName,asciiName,types=FILE_TYPES){
  if(typeof window.showSaveFilePicker==='function'){
    let h;
    try{ h=await window.showSaveFilePicker({suggestedName:koName,types}); }
    catch(e){ if(e&&e.name==='AbortError') return false; h=null; }
    if(h){ const w=await h.createWritable(); await w.write(text); await w.close(); return true; }
  }
  download(text,asciiName); return true;
}
function download(text,name){
  const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'}));
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
/** 데이터 파일 고르기: 가능하면 동기화에 쓸 수 있는 파일 핸들까지 받음 */
async function chooseDataFile(){
  let handle=null, file=null;
  if(Sync.supported){
    try{ [handle]=await window.showOpenFilePicker({types:FILE_TYPES,multiple:false}); file=await handle.getFile(); }
    catch(e){ if(e && e.name==='AbortError') return null; handle=null; }
  }
  if(!file){ file=await pickFileInput('.tdata,.json'); if(!file) return null; }
  if(file.size>30*1024*1024){ await alertModal('파일 오류','파일이 너무 큽니다.'); return null; }
  const env=parseEnvText(await file.text());
  if(!env){ await alertModal('파일 오류','전담 수업 노트에서 만든 파일(.tdata)이 아닙니다.'); return null; }
  return {env,handle,name:file.name};
}

async function submitUnlock(f){
  const err=$('#unlock-err'), btn=f.querySelector('button[type=submit]');
  if(Date.now()<S.waitUntil){ err.textContent=`여러 번 틀려서 ${Math.ceil((S.waitUntil-Date.now())/1000)}초 뒤에 다시 시도할 수 있습니다.`; return; }
  btn.disabled=true; btn.textContent='여는 중…'; err.textContent='';
  if(bc){ bc.postMessage('claim'); await sleep(250); }
  try{
    const env=await DB.get('envelope');
    const r=await tryEnvWithPassword(env,f.pw.value);
    adoptKey(r); S.data=normalize(r.data); S.fails=0;
  }catch{
    S.fails++;
    if(S.fails>=5){ S.waitUntil=Date.now()+30000; S.fails=0; }
    err.textContent='비밀번호가 맞지 않습니다.'; btn.disabled=false; btn.textContent='열기'; f.pw.select(); return;
  }
  enterApp(true);
}

async function classModal(c){
  const isNew=!c;
  const v=c||{grade:5,room:1+S.data.classes.filter(x=>x.grade===5).reduce((m,x)=>Math.max(m,x.room),0),
    color:COLORS[S.data.classes.length%COLORS.length],textbookId:(S.data.textbooks[0]||{}).id||''};
  const body=`<div class="form-row">
      <label class="field"><span>학년</span><select name="grade">${[1,2,3,4,5,6].map(g=>`<option value="${g}" ${g===v.grade?'selected':''}>${g}학년</option>`).join('')}</select></label>
      <label class="field"><span>반</span><input type="number" name="room" min="1" max="30" value="${v.room}"></label></div>
    <div class="field"><span class="lbl">색상 (시간표·화면에서 반을 구분하는 색)</span><div class="swatches">
      ${COLORS.map(col=>`<label class="sw" style="--c:${col}"><input type="radio" name="color" value="${col}" ${col===v.color?'checked':''} aria-label="색상 ${col}"><span></span></label>`).join('')}</div></div>
    <label class="field"><span>교과·단원 목록 (진도 관리에 사용)</span><select name="tb"><option value="">선택 안 함</option>
      ${S.data.textbooks.map(t=>`<option value="${esc(t.id)}" ${t.id===v.textbookId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>
    <p class="err"></p>`;
  let vals=null;
  const r=await openModal({title:isNew?'학급 추가':'학급 정보 수정',body,
    buttons:[{label:'취소'},{label:isNew?'추가':'저장',value:'ok',cls:'primary'}],
    onAction:(val,root)=>{
      const g=+root.querySelector('[name=grade]').value, rm=parseInt(root.querySelector('[name=room]').value,10), err=root.querySelector('.err');
      if(!(rm>=1&&rm<=30)){err.textContent='반은 1~30 사이 숫자로 입력해 주세요.';return false;}
      if(S.data.classes.some(x=>x.grade===g&&x.room===rm&&x!==c)){err.textContent=`${g}-${rm}반은 이미 있습니다.`;return false;}
      const col=(root.querySelector('[name=color]:checked')||{}).value;
      vals={grade:g,room:rm,color:COLORS.includes(col)?col:COLORS[0],textbookId:root.querySelector('[name=tb]').value};
      return true;
    }});
  if(r.value!=='ok') return;
  if(!isNew && c.textbookId!==vals.textbookId && S.data.lessons.some(l=>l.classId===c.id)){
    if(!await confirmModal('단원 목록 바꾸기','<p>단원 목록을 바꾸면 지금까지의 진도 기록이 화면에 나타나지 않습니다. (원래 목록으로 되돌리면 다시 보입니다)</p><p>계속할까요?</p>','바꾸기',false)) return;
  }
  if(isNew){ const nc={id:uid(),...vals,students:[],memo:''}; S.data.classes.push(nc); S.classId=nc.id; S.page='classes'; touch(); renderShell();
    toast(`${cname(nc)}반을 추가했습니다. 학생 명단을 넣어 주세요.`); }
  else { Object.assign(c,vals); touch(); renderMain(); }
}
async function deleteClass(c){
  const nl=S.data.lessons.filter(l=>l.classId===c.id).length, nr=S.data.records.filter(r=>r.classId===c.id).length;
  const ok=await typedConfirm('학급 삭제',`<p><b>${esc(cname(c))}반</b>과 학생 명단, 시간표 배정${nl?`, 진도 기록 ${nl}건`:''}${nr?`, 누가기록 ${nr}건`:''}, 과제 체크·수행평가 결과가 모두 삭제됩니다.</p>`,cname(c),'삭제');
  if(!ok) return;
  S.data.classes=S.data.classes.filter(x=>x!==c);
  S.data.lessons=S.data.lessons.filter(l=>l.classId!==c.id);
  S.data.records=S.data.records.filter(r=>r.classId!==c.id);
  S.data.checks=S.data.checks.filter(x=>x.classId!==c.id);
  forgetStudents(c.students.map(x=>x.id)); S.data.assessments.forEach(a=>{a.classIds=a.classIds.filter(id=>id!==c.id);});
  for(const [k,v] of Object.entries(S.data.timetable)) if(v===c.id) delete S.data.timetable[k];
  S.classId=null; touch(); renderMain(); toast('학급을 삭제했습니다.');
}
function parseRoster(text){
  const out=[];
  for(let line of text.split(/\r?\n/)){
    line=line.trim(); if(!line) continue;
    let no=null, name='';
    const cols=line.split(/\t|,/).map(s=>s.trim()).filter(Boolean);
    if(cols.length>=2 && /^\d{1,2}$/.test(cols[0])){ no=+cols[0]; name=cols[1]; }
    else{
      const m=line.match(/^(\d{1,2})[\s.)\-번]+(.+)$/);
      if(m){ no=+m[1]; name=m[2].trim(); } else name=cols[0]||line;
    }
    if(/^(번호|이름|성명|no\.?|name)$/i.test(name)||/^(번호|no\.?)$/i.test(cols[0]||'')) continue;
    let g='';
    const gtok=cols.slice(1).concat(name.split(/\s+/).slice(1)).map(x=>x.trim()).find(x=>/^(남|여|남자|여자|m|f)$/i.test(x));
    if(gtok) g=/^(남|남자|m)$/i.test(gtok)?'m':'f';
    name=name.replace(/\s+(남|여|남자|여자)$/,'').trim().slice(0,MAX_NAME);
    if(name) out.push({no:no&&no>=1&&no<=99?no:null,name,g});
  }
  return out;
}
function planRoster(c,parsed,mode){
  const base=mode==='replace'?[]:c.students;
  const used=new Set(base.map(s=>s.no));
  let next=base.reduce((m,s)=>Math.max(m,s.no),0);
  return parsed.map(p=>{
    let no=p.no, dup=false;
    if(no==null){ do{next++;}while(used.has(next)); no=next; }
    else if(used.has(no)) dup=true;
    if(!dup){ used.add(no); next=Math.max(next,no); }
    return {no,name:p.name,g:p.g||'',dup:dup||no>99};
  });
}
async function rosterModal(c){
  const hasExisting=c.students.length>0;
  const body=`<p class="muted">엑셀에서 <b>번호·이름(·성별)</b> 칸을 복사해 붙여넣거나, <b>이름만 한 줄에 하나씩</b> 써도 됩니다. 성별(남/여)은 넣지 않아도 됩니다.</p>
    <textarea class="tall" name="txt" placeholder="예)&#10;1&#9;김철수&#9;남&#10;2&#9;이영희&#9;여&#10;또는 이름만 한 줄씩"></textarea>
    ${hasExisting?`<div class="field" style="margin-top:12px"><label class="check"><input type="radio" name="mode" value="append" checked> 기존 명단 뒤에 추가</label>
      <label class="check" style="margin-left:14px"><input type="radio" name="mode" value="replace"> 기존 명단을 지우고 새로 넣기</label></div>`:''}
    <div class="preview" hidden></div><p class="err"></p>`;
  let plan=[], mode='append';
  const update=root=>{
    mode=(root.querySelector('[name=mode]:checked')||{value:'append'}).value;
    plan=planRoster(c,parseRoster(root.querySelector('[name=txt]').value),mode);
    const pv=root.querySelector('.preview');
    pv.hidden=!plan.length;
    pv.innerHTML=`<table><thead><tr><th>번호</th><th>이름</th><th>성별</th><th></th></tr></thead><tbody>${plan.map(p=>`<tr class="${p.dup?'bad':''}"><td>${p.no}</td><td>${esc(p.name)}</td><td>${{m:'남',f:'여'}[p.g]||''}</td><td>${p.dup?'번호 중복 - 제외':''}</td></tr>`).join('')}</tbody></table>`;
    const n=plan.filter(p=>!p.dup).length;
    root.querySelector('.modal-actions .btn.primary').textContent=n?`${n}명 넣기`:'넣기';
  };
  const r=await openModal({title:`${cname(c)}반 명단 넣기`,body,
    buttons:[{label:'취소'},{label:'넣기',value:'ok',cls:'primary'}],
    onOpen:root=>{root.addEventListener('input',()=>update(root));root.addEventListener('change',()=>update(root));},
    onAction:(v,root)=>{
      update(root);
      if(!plan.some(p=>!p.dup)){root.querySelector('.err').textContent='넣을 학생이 없습니다.';return false;}
      return true;
    }});
  if(r.value!=='ok') return;
  if(mode==='replace'){
    const nr=S.data.records.filter(r=>r.classId===c.id).length;
    if(!await confirmModal('기존 명단 지우기',`<p>기존 학생 ${c.students.length}명이 삭제되고 새 명단으로 바뀝니다.${nr?` <b>이 반의 누가기록 ${nr}건도 함께 삭제됩니다.</b>`:''} 계속할까요?</p>`,'바꾸기',true)) return;
    forgetStudents(c.students.map(x=>x.id)); c.students=[]; c.avoid=[]; S.data.records=S.data.records.filter(r=>r.classId!==c.id);
  }
  const add=plan.filter(p=>!p.dup);
  add.forEach(p=>c.students.push({id:uid(),no:p.no,name:p.name,g:p.g,left:false}));
  touch(); renderMain(); toast(`${add.length}명을 넣었습니다.`);
}
function addStudent(f){
  const c=getClass(S.classId); if(!c) return;
  const name=f.name.value.trim().slice(0,MAX_NAME), no=parseInt(f.no.value,10);
  if(!name){ f.name.focus(); return; }
  if(!(no>=1&&no<=99)){ toast('번호는 1~99 사이로 입력해 주세요.'); f.no.focus(); return; }
  if(c.students.some(s=>s.no===no)){ toast(`${no}번 학생이 이미 있습니다.`); f.no.select(); return; }
  const g=f.g.value==='m'||f.g.value==='f'?f.g.value:'';
  c.students.push({id:uid(),no,name,g,left:false});
  touch(); renderMain();
  const nf=$('#stu-add [name=name]'); if(nf) nf.focus();
}

  const state=Sync.conflict?'<span class="dot bad"></span> 충돌 - 동기화 멈춤':!Sync.ok?'<span class="dot warn"></span> 파일 접근 허용 필요':'<span class="dot ok"></span> 켜짐 - 고칠 때마다 자동 저장';

/* =====================================================================
   2단계: 진도 · 누가기록 · 수업 메모 · 교과서 설정
   ===================================================================== */
const range = n => Array.from({length:n},(_,i)=>i+1);
const getTB = c => c && S.data.textbooks.find(t=>t.id===c.textbookId);
function flatUnits(tb){const out=[];tb.units.forEach(u=>{for(let p=1;p<=u.periods;p++)out.push({u,p});});return out;}
function progressOf(c){
  const tb=getTB(c); if(!tb) return null;
  const fl=flatUnits(tb), idx=new Map(fl.map((x,i)=>[x.u.id+'#'+x.p,i]));
  const done=new Set(); let far=-1, last=null;
  for(const l of S.data.lessons){
    if(l.classId!==c.id) continue;
    const i=idx.get(l.unitId+'#'+l.period); if(i===undefined) continue;
    done.add(i); if(i>far) far=i;
    if(!last||l.date>last.date||(l.date===last.date&&l.createdAt>last.createdAt)) last=l;
  }
  return {tb,fl,idx,total:fl.length,done:done.size,doneSet:done,far,cur:far>=0?fl[far]:null,next:fl[far+1]||null,last};
}
const posText = x => x?`${x.u.label||'단원'} · ${x.p}차시`:'-';
function logPos(tb,l){const u=tb&&tb.units.find(x=>x.id===l.unitId);return u?`${u.label||'단원'} · ${l.period}차시`:'(삭제된 단원)';}
function latestLog(cid,uidv,p){let r=null;for(const l of S.data.lessons)if(l.classId===cid&&l.unitId===uidv&&l.period===p&&(!r||l.date>r.date||(l.date===r.date&&l.createdAt>r.createdAt)))r=l;return r;}
const loggedToday = c => S.data.lessons.some(l=>l.classId===c.id&&l.date===todayStr());
function progLine(c){
  const pr=progressOf(c);
  if(!pr) return `<span class="muted">단원 목록 미지정</span>`;
  if(!pr.total) return `<span class="muted">단원 목록이 비어 있습니다</span>`;
  const nextTxt=pr.next?`<b>${esc(posText(pr.next))}</b>`:'<b>모든 단원 완료</b>';
  if(pr.last&&pr.last.date===todayStr())
    return `<span>오늘 <b>${esc(logPos(pr.tb,pr.last))}</b> 완료 → 다음 시간 ${nextTxt}</span>`;
  const last=pr.last?`지난 시간(${fmtD(pr.last.date)}) <b>${esc(logPos(pr.tb,pr.last))}</b>`:'<span class="muted">진도 기록 없음</span>';
  const next=` → 이번 ${nextTxt}`;
  return `<span>${last}${next}</span>`;
}
function compareCard(){
  const rows=sortedClasses().map(c=>({c,pr:progressOf(c)}));
  const ok=rows.filter(r=>r.pr&&r.pr.total);
  if(!ok.length) return '';
  const max={}, cnt={};
  ok.forEach(r=>{const k=r.pr.tb.id;max[k]=Math.max(max[k]??-1,r.pr.far);cnt[k]=(cnt[k]||0)+1;});
  return `<div class="card"><div class="card-head"><h2>반별 진도 비교</h2>${S.page!=='progress'?'<button class="link" data-act="nav" data-page="progress">진도 자세히</button>':''}</div>
    <div class="cmp">${rows.map(({c,pr})=>{
      if(!pr||!pr.total) return `<div class="cmp-row">${chip(c)}<div class="bar"></div><span class="cmp-txt muted">단원 목록 미지정</span></div>`;
      const pct=Math.round((pr.far+1)/pr.total*100), gap=max[pr.tb.id]-pr.far;
      const rel=cnt[pr.tb.id]<2?'':gap>0?`<span class="behind">${gap}차시 늦음</span>`:'<span class="muted">가장 앞섬</span>';
      return `<div class="cmp-row">${chip(c)}<div class="bar" title="${pct}%"><span style="width:${pct}%;background:${c.color}"></span></div>
        <span class="cmp-txt"><b>${esc(pr.cur?posText(pr.cur):'시작 전')}</b> ${rel}</span></div>`;}).join('')}</div></div>`;
}

function quickBtn(c,doneToday){
  if(doneToday) return '';
  const pr=progressOf(c); if(!pr||!pr.next) return '';
  return `<button class="btn primary" data-act="lesson-quick" data-id="${esc(c.id)}">✓ ${esc(pr.next.u.label||'단원')} ${pr.next.p}차시 마침</button>`;

function toastAction(msg,label,fn){
  const box=$('#toast'); while(box.children.length>=2) box.firstChild.remove();
  const el=document.createElement('div'); el.className='toast has-act';
  const t=document.createElement('span'); t.textContent=msg;
  const b=document.createElement('button'); b.type='button'; b.textContent=label;
  b.onclick=()=>{el.remove();fn();};
  el.append(t,b); box.appendChild(el); setTimeout(()=>el.remove(),7000);
}

/* ---------- 교과서 설정 ---------- */
function parseUnits(text,defP){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const cols=raw.split('\t').map(s=>s.trim()).filter(Boolean);
    let periods=null;
    if(cols.length>=2&&/^\d{1,2}$/.test(cols[cols.length-1])) periods=+cols.pop();
    const line=cols.join(' ').replace(/\s*(\.{2,}|…+|·{2,}|-{3,})\s*\d*\s*$/,'').trim();
    if(!line) continue;
    const m=line.match(/^(lesson\s*\d+|review\s*\d*|board\s*game|unit\s*\d+|project\s*\d*|\d+\s*단원|단원\s*\d+)\s*[.:\-–]?\s*(.*)$/i);
    const label=m?m[1].replace(/\s+/g,' '):'', title=m?m[2].trim():line;
    if(periods==null) periods=/review|board|project/i.test(label)?1:defP;
    out.push({label:label.slice(0,30),title:title.slice(0,100),periods:Math.min(Math.max(periods,0),40)});
  }
  return out;
}

/* =====================================================================
   3단계: 자리배치 · 수업 화면 모드
   ===================================================================== */
const LAYOUTS = {single:{name:'1인 분단',cg:1,rg:1},pairs:{name:'2인 짝',cg:2,rg:1},g4:{name:'4인 모둠',cg:2,rg:2},g6:{name:'6인 모둠',cg:3,rg:2}};
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const activeStudents = c => c.students.filter(s=>!s.left).sort((a,b)=>a.no-b.no);
function seatingOf(c){
  if(!c.seating){const n=activeCount(c),cols=6,rows=Math.max(4,Math.ceil(n/cols));c.seating={type:'pairs',rows,cols,seats:Array(rows*cols).fill(''),locked:[]};}
  const st=c.seating, act=new Set(activeStudents(c).map(s=>s.id)), seen=new Set();
  st.seats=st.seats.map(v=>{if(v===''||v==='#')return v;if(!act.has(v)||seen.has(v))return '';seen.add(v);return v;});
  st.locked=st.locked.filter(i=>st.seats[i]&&st.seats[i]!=='#');
  return st;
}
function blockKey(st,i){const L=LAYOUTS[st.type]||LAYOUTS.pairs,r=Math.floor(i/st.cols),c=i%st.cols;return Math.floor(r/L.rg)+'-'+Math.floor(c/L.cg);}
function adjacent(st,i,j){
  if(blockKey(st,i)===blockKey(st,j)) return true;
  const L=LAYOUTS[st.type]||LAYOUTS.pairs;
  return L.cg===1 && Math.floor(i/st.cols)===Math.floor(j/st.cols) && Math.abs(i%st.cols-j%st.cols)===1;
}
function seatViolations(c,st,seats){
  const pos=new Map(); seats.forEach((v,i)=>{if(v&&v!=='#')pos.set(v,i);});
  return (c.avoid||[]).filter(([a,b])=>pos.has(a)&&pos.has(b)&&adjacent(st,pos.get(a),pos.get(b))).length;
}
function seatLabel(s,showG){return s?`<span class="sno">${showG&&s.g?`<i class="gdot g-${s.g}" title="${s.g==='m'?'남':'여'}"></i>`:''}${s.no}</span><span class="sname">${esc(s.name)}</span>`:'';}

/** 자리 격자 (교사 화면·수업 화면 공용) */
function seatGridHTML(c,{flip=false,interactive=false,big=false}={}){
  const st=seatingOf(c), L=LAYOUTS[st.type]||LAYOUTS.pairs, smap=new Map(c.students.map(s=>[s.id,s]));
  const rows=range(st.rows).map(x=>x-1), cols=range(st.cols).map(x=>x-1);
  if(flip){rows.reverse();cols.reverse();}
  const track=(list,g)=>{const t=[],pos=[];list.forEach((v,k)=>{if(k&&Math.floor(list[k-1]/g)!==Math.floor(v/g))t.push('aisle');t.push('cell');pos.push(t.length);});return {t,pos};};
  const C=track(cols,L.cg), R=L.rg>1?track(rows,L.rg):{t:rows.map(()=>'cell'),pos:rows.map((_,k)=>k+1)};
  const gtc=C.t.map(x=>x==='cell'?'minmax(64px,var(--seatw))':'var(--aisle)').join(' ');
  const gtr=R.t.map(x=>x==='cell'?'auto':'var(--aisle)').join(' ');
  const locked=new Set(st.locked);
  let cells='';
  rows.forEach((r,ri)=>cols.forEach((cc,ci)=>{
    const i=r*st.cols+cc, v=st.seats[i], pos=`grid-row:${R.pos[ri]};grid-column:${C.pos[ci]}`;
    if(v==='#'){cells+=`<div class="seat nodesk" style="${pos}" data-drop="s:${i}" data-cell="${i}"></div>`;return;}
    const s=v&&smap.get(v);
    if(s){
      const sel=interactive&&S.seatSel==='s:'+i;
      cells+=`<div class="seat filled ${locked.has(i)?'locked':''} ${sel?'sel':''}" style="${pos}" data-drop="s:${i}" data-cell="${i}" ${interactive?`data-drag="s:${i}"`:''}>${seatLabel(s,interactive)}
        ${interactive?`<button type="button" class="pin" data-act="seat-pin" data-i="${i}" aria-label="자리 고정">${locked.has(i)?'고정됨':'고정'}</button>`:locked.has(i)&&!big?'':''}</div>`;
    }else cells+=`<div class="seat empty" style="${pos}" data-drop="s:${i}" data-cell="${i}">${interactive?'빈자리':''}</div>`;
  }));
  const board=`<div class="board-bar">${flip?'교탁 · 칠판 (교사 쪽)':'칠판'}</div>`;
  return `<div class="seat-board ${big?'big':''}" style="--c:${c.color}">${flip?'':board}<div class="seat-grid" style="grid-template-columns:${gtc};grid-template-rows:${gtr}">${cells}</div>${flip?board:''}</div>`;
}

/* ---------- 자리 옮기기 ---------- */
function seatMove(src,dst){
  const c=getClass(S.seatClass); if(!c) return;
  const st=seatingOf(c), lk=new Set(st.locked);
  S.seatSel=null;
  if(dst.startsWith('s:')){
    const j=+dst.slice(2); if(st.seats[j]==='#') return renderMain();
    if(src.startsWith('s:')){
      const i=+src.slice(2); if(i===j) return renderMain();
      [st.seats[i],st.seats[j]]=[st.seats[j],st.seats[i]];
      const li=lk.has(i),lj=lk.has(j); lk.delete(i);lk.delete(j); if(li)lk.add(j); if(lj)lk.add(i);
    }else{
      const id=src.slice(2), old=st.seats.indexOf(id); if(old>=0){st.seats[old]='';lk.delete(old);}
      st.seats[j]=id;
    }
  }else if(dst==='w' && src.startsWith('s:')){ const i=+src.slice(2); st.seats[i]=''; lk.delete(i); }
  st.locked=[...lk]; touch(); renderMain();
}
function seatTap(src){
  if(S.deskEdit) return;
  const sel=S.seatSel;
  if(!sel){S.seatSel=src;return renderMain();}
  if(sel===src){S.seatSel=null;return renderMain();}
  if(src.startsWith('s:')) return seatMove(sel,src);
  if(sel.startsWith('s:')) return seatMove(src,sel);   // 대기 학생을 고른 자리에
  S.seatSel=src; renderMain();
}
let seatDrag=null;
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#seat-area')||e.button>0||S.deskEdit||e.target.closest('button')) return;
  const el=e.target.closest('[data-drag]'); if(!el) return;
  seatDrag={src:el.dataset.drag,el,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false,ghost:null,over:null};
});
document.addEventListener('pointermove',e=>{
  const d=seatDrag; if(!d||e.pointerId!==d.id) return;
  if(!d.moved){ if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<8) return;
    d.moved=true; const r=d.el.getBoundingClientRect(); d.ghost=d.el.cloneNode(true); d.ghost.classList.add('ghost');
    d.ghost.style.width=r.width+'px'; d.ghost.style.height=r.height+'px'; document.body.appendChild(d.ghost); d.el.classList.add('dragging'); }
  d.ghost.style.left=(e.clientX-d.ghost.offsetWidth/2)+'px'; d.ghost.style.top=(e.clientY-d.ghost.offsetHeight/2)+'px';
  const t=document.elementFromPoint(e.clientX,e.clientY), tg=t&&t.closest('[data-drop]');
  if(d.over&&d.over!==tg) d.over.classList.remove('over'); if(tg){tg.classList.add('over');} d.over=tg;
  e.preventDefault();
},{passive:false});
document.addEventListener('pointerup',e=>{
  const d=seatDrag; if(!d||e.pointerId!==d.id) return; seatDrag=null;
  if(d.ghost) d.ghost.remove(); d.el.classList.remove('dragging'); if(d.over) d.over.classList.remove('over');
  if(d.moved){ const t=document.elementFromPoint(e.clientX,e.clientY), tg=t&&t.closest('[data-drop]'); if(tg) seatMove(d.src,tg.dataset.drop); }
  else seatTap(d.src);
});
document.addEventListener('pointercancel',()=>{const d=seatDrag;if(!d)return;seatDrag=null;if(d.ghost)d.ghost.remove();d.el.classList.remove('dragging');if(d.over)d.over.classList.remove('over');});
document.addEventListener('click',e=>{
  if(!e.target.closest('#seat-area')||e.target.closest('[data-drag]')||e.target.closest('button')) return;
  const tg=e.target.closest('[data-drop]'); if(!tg) return;
  const c=getClass(S.seatClass); if(!c) return;
  if(S.deskEdit && tg.dataset.cell!==undefined){
    const st=seatingOf(c), i=+tg.dataset.cell;
    st.seats[i]=st.seats[i]==='#'?'':'#'; st.locked=st.locked.filter(x=>x!==i); touch(); renderMain(); return;
  }
  if(S.seatSel) seatMove(S.seatSel,tg.dataset.drop);
});

function snapshotSeating(c,label){
  const st=seatingOf(c);
  if(!st.seats.some(v=>v&&v!=='#')) return false;
  c.seatHistory=c.seatHistory||[];
  c.seatHistory.unshift({id:uid(),at:Date.now(),label:label.slice(0,40),type:st.type,rows:st.rows,cols:st.cols,seats:st.seats.slice(),locked:st.locked.slice()});
  c.seatHistory=c.seatHistory.slice(0,20);
  return true;
}
async function randomSeats(c){
  const st=seatingOf(c), lk=new Set(st.locked);
  const lockedIds=new Set([...lk].map(i=>st.seats[i]));
  const desks=st.seats.map((v,i)=>i).filter(i=>st.seats[i]!=='#'&&!lk.has(i));
  const pool=activeStudents(c).map(s=>s.id).filter(id=>!lockedIds.has(id));
  if(!pool.length) return toast('배치할 학생이 없습니다.');
  if(!await confirmModal('무작위 배치',`<p>학생 ${pool.length}명을 무작위로 앉힙니다.${st.mixGender?' <b>남녀를 섞어</b> 앉힙니다.':''}${lk.size?` 고정한 자리 ${lk.size}곳은 그대로 둡니다.`:''}</p>${(c.avoid||[]).length?`<p>짝 피하기 ${c.avoid.length}쌍을 지키도록 배치합니다.</p>`:''}<p class="muted">지금 배치는 이력에 자동으로 저장됩니다.</p>`,'배치하기')) return;
  snapshotSeating(c,'무작위 배치 전 자동 저장');
  const smap=new Map(c.students.map(s=>[s.id,s])), mix=!!st.mixGender&&pool.some(id=>smap.get(id).g);
  let best=null,bv=Infinity;
  for(let t=0;t<600&&bv>0;t++){
    const p=shuffleArr(pool.slice()), seats=st.seats.map((v,i)=>lk.has(i)||v==='#'?v:'');
    if(mix){
      // 바둑판 무늬로 남·여를 번갈아 앉힘 → 짝·모둠·앞뒤옆이 자연스럽게 섞임
      const q={m:[],f:[],'':[]}, flip=rnd(2);
      p.forEach(id=>q[smap.get(id).g||''].push(id));
      for(const i of desks){
        const want=((Math.floor(i/st.cols)+i%st.cols+flip)%2)?'f':'m', other=want==='m'?'f':'m';
        const id=q[want].shift()||q[''].shift()||q[other].shift(); if(!id) break; seats[i]=id;
      }
    }else desks.forEach((i,k)=>{seats[i]=p[k]||'';});
    const v=seatViolations(c,st,seats); if(v<bv){bv=v;best=seats;}
  }
  st.seats=best; touch(); renderMain();
  const left=pool.length-desks.length;
  if(left>0) alertModal('책상이 모자랍니다',`<p>책상이 ${left}개 모자라서 ${left}명은 '자리 없는 학생'에 남았습니다. 줄·칸 수를 늘려 주세요.</p>`);
  else if(bv>0) alertModal('짝 피하기를 모두 지키지 못했습니다',`<p>${bv}쌍이 옆자리가 되었습니다. 다시 배치하거나 직접 옮겨 주세요.</p>`);
  else toast('무작위로 배치했습니다.');
}
function resizeSeating(c,rows,cols){
  const st=seatingOf(c); if(rows===st.rows&&cols===st.cols) return;
  const seats=Array(rows*cols).fill(''), lk=[], out=[];
  st.seats.forEach((v,i)=>{const r=Math.floor(i/st.cols),cc=i%st.cols;
    if(r<rows&&cc<cols){const j=r*cols+cc;seats[j]=v;if(st.locked.includes(i))lk.push(j);} else if(v&&v!=='#') out.push(v);});
  Object.assign(st,{rows,cols,seats,locked:lk});
  touch(); renderMain();
  if(out.length) toast(`${out.length}명이 '자리 없는 학생'으로 옮겨졌습니다.`);
}
async function avoidModal(c){

  await openModal({title:`${cname(c)}반 짝 피하기`,
    body:`<p class="muted">무작위 배치와 모둠 만들기에서 <b>서로 옆자리·같은 모둠이 되지 않게</b> 할 학생 쌍입니다. 이 정보는 화면에 표시되지 않습니다.</p>
      <div class="form-row"><select name="a">${opts}</select><select name="b">${opts}</select><button type="button" class="btn" data-add="1">추가</button></div>

    buttons:[{label:'닫기',value:'ok',cls:'primary'}],

        if(e.target.dataset.add){
          const a=root.querySelector('[name=a]').value,b=root.querySelector('[name=b]').value;
          if(!a||a===b){err.textContent='서로 다른 두 학생을 골라 주세요.';return;}
          if(c.avoid.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))){err.textContent='이미 있는 쌍입니다.';return;}

}

function goalPos(c){

function makeGroups(c){
  const g=S.display.groups, act=activeStudents(c).map(s=>s.id);
  if(!act.length) return toast('학생이 없습니다.');
  const k=Math.max(1,Math.min(act.length,g.mode==='count'?g.n:Math.ceil(act.length/Math.max(1,g.n))));
  let best=null,bv=Infinity;
  for(let t=0;t<400&&bv>0;t++){
    const smap0=new Map(c.students.map(s=>[s.id,s]));
    const p=g.mix!==false?['m','f',''].flatMap(x=>shuffleArr(act.filter(id=>(smap0.get(id).g||'')===x))):shuffleArr(act.slice());
    const list=Array.from({length:k},()=>[]), off=rnd(k);
    p.forEach((id,i)=>list[(i+off)%k].push(id));
    shuffleArr(list);
    const where=new Map(); list.forEach((m,gi)=>m.forEach(id=>where.set(id,gi)));
    const v=(c.avoid||[]).filter(([a,b])=>where.has(a)&&where.get(a)===where.get(b)).length;
    if(v<bv){bv=v;best=list;}
  }
  const smap=new Map(c.students.map(s=>[s.id,s]));
  best.forEach(m=>m.sort((a,b)=>smap.get(a).no-smap.get(b).no));
  g.result={cid:c.id,list:best}; renderDisplayMain();
}
function seatGroups(c){
  const st=seatingOf(c), m=new Map();
  st.seats.forEach((v,i)=>{if(v&&v!=='#'){const k=blockKey(st,i);if(!m.has(k))m.set(k,[]);m.get(k).push(v);}});
  const keys=[...m.keys()].sort((a,b)=>{const [a1,a2]=a.split('-').map(Number),[b1,b2]=b.split('-').map(Number);return a1-b1||a2-b2;});
  if(!keys.length) return toast('자리배치에 앉은 학생이 없습니다.');
  S.display.groups.result={cid:c.id,list:keys.map(k=>m.get(k))}; renderDisplayMain();
}
let picking=false;
function doPick(c){
  if(picking) return;
  const p=S.display.pick, act=activeStudents(c);
  let pool=act.filter(s=>!p.exclude||!p.picked.includes(s.id));
  if(!pool.length) return toast('모두 뽑았습니다. "처음부터"를 누르세요.');
  const n=Math.min(p.count,pool.length), chosen=shuffleArr(pool.slice()).slice(0,n).map(s=>s.id);
  picking=true; const out=$('#pick-out'); let ticks=0;
  const iv=setInterval(()=>{
    if(!S.display||!out.isConnected){clearInterval(iv);picking=false;return;}
    if(++ticks>18){clearInterval(iv);picking=false;
      p.current=chosen; chosen.forEach(id=>{if(!p.picked.includes(id))p.picked.push(id);}); renderDisplayMain(); const o=$('#pick-out'); if(o)o.classList.add('pop'); return;}
    out.innerHTML=shuffleArr(act.slice()).slice(0,n).map(s=>`<span class="pname rolling">${esc(s.name)}</span>`).join('');
  },70);
}
function readTimerInput(){
  const m=parseInt(($('#t-min')||{}).value,10)||0, sc=parseInt(($('#t-sec')||{}).value,10)||0;
  if(m<0||m>99||sc<0||sc>59){toast('분은 0~99, 초는 0~59로 넣어 주세요.');return null;}
  const v=m*60+sc; if(v<1){toast('1초 이상으로 정해 주세요.');return null;} return v;
}
function fmtClock(sec){sec=Math.max(0,Math.ceil(sec));return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`;}
function timerPaint(){
  if(!S.display) return; const t=S.display.timer;
  const dg=$('#timer-digits'); if(dg){dg.textContent=fmtClock(t.remain);dg.classList.toggle('done',t.done);}
  const go=$('#t-go'); if(go) go.textContent=t.running?'일시정지':'시작';
  const mt=$('#mini-timer'); if(mt){const show=S.display.tool!=='timer'&&(t.running||t.done);mt.textContent=show?'⏱ '+fmtClock(t.remain):'';mt.classList.toggle('done',t.done);}
}
function beep(){
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(dl=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(0.3,ac.currentTime+dl+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dl+0.3);
      o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+0.32);});
    setTimeout(()=>ac.close(),1500);}catch{}
}
setInterval(()=>{
  if(!S.display) return; const t=S.display.timer; if(!t.running) return;
  t.remain=Math.max(0,(t.endAt-Date.now())/1000);
  if(t.remain<=0){t.running=false;t.done=true;if(t.sound)beep();}
  timerPaint();
},250);

/* ---------- 칭찬 점수 ---------- */
const praiseOn = () => !!(S.data&&S.data.settings.praiseOn);
function teamsOf(c){ if(!c.teams||!Array.isArray(c.teams.pts)) c.teams={n:4,pts:[0,0,0,0]}; while(c.teams.pts.length<c.teams.n)c.teams.pts.push(0); c.teams.pts.length=c.teams.n; return c.teams; }
function dispTools(){ return praiseOn()?TOOLS.concat([['praise','칭찬 점수']]):TOOLS; }
function praiseHTML(c){

function forgetStudents(sids){

/* =====================================================================
   듀얼 모니터: 교사 창 ↔ 학생 창
   - 저장은 교사 창만 합니다. 학생 창은 비밀번호·암호화 키·저장소를 전혀 쓰지 않습니다.
   - 두 창은 같은 브라우저 안의 전용 통로(BroadcastChannel)로만 주고받고, 통로 이름에는
     창을 열 때마다 새로 만든 무작위 열쇠가 붙습니다. 인터넷으로는 아무것도 나가지 않습니다.
   - 학생 창으로는 이름·자리·과제 제목·칭찬 점수·학습 목표만 보냅니다.
     (짝 피하기·성별은 모둠 계산에만 쓰이고 화면에 나오지 않습니다. 누가기록·수행평가·진도 메모는 보내지 않습니다.)
   ===================================================================== */
const Live={win:null,ch:null,pending:[],lastJSON:'',show:null,t:null,
  open(){return !!(this.ch&&this.win&&!this.win.closed);}};
function commit(op){
  if(!IS_STUDENT) return touch();
  if(SL.ch&&!SL.gone){ SL.ch.postMessage({t:'op',op}); if(SL.locked){SL.pending++;studentStatus();} }
}
function liveStart(classId,tool){
  if(Live.open()){ Live.ch.postMessage({t:'show',classId,tool}); try{Live.win.focus();}catch{} toast('학생 창에 보냈습니다.'); return; }
  const token=Array.from(rand(16),b=>b.toString(16).padStart(2,'0')).join('');
  const w=window.open(location.href.split('#')[0]+'#student-'+token,'jeondam-student','popup,width=1280,height=800');
  if(!w){ alertModal('새 창을 열 수 없습니다','<p>브라우저가 새 창(팝업)을 막았습니다. 주소창 오른쪽의 <b>팝업 차단</b> 표시를 눌러 항상 허용한 뒤 다시 눌러 주세요.</p>'); return; }
  liveClose(true);
  Live.win=w; Live.ch=new BroadcastChannel('jeondam-live-'+token); Live.show={classId,tool}; Live.lastJSON='';
  Live.ch.onmessage=e=>liveOnTeacher(e.data);
  renderStatus();
  toast('학생 창을 열었습니다. 전자칠판 쪽으로 옮긴 뒤 "전체 화면"을 누르세요.');
}
function liveClose(keepWindow){
  if(Live.ch){ try{Live.ch.postMessage({t:'bye'});}catch{} Live.ch.close(); }
  if(!keepWindow&&Live.win&&!Live.win.closed){ try{Live.win.close();}catch{} }
  Live.ch=null; Live.win=null; Live.lastJSON=''; renderStatus();
}
function liveSnapshot(){
  const st=S.data.settings;
  return {praiseOn:!!st.praiseOn,checkSelfTap:!!st.checkSelfTap,
    classes:sortedClasses().map(c=>{const sg=seatingOf(c),tm=teamsOf(c);return {id:c.id,grade:c.grade,room:c.room,color:c.color,
      students:activeStudents(c).map(s=>({id:s.id,no:s.no,name:s.name,g:s.g||'',left:false})),
      seating:{type:sg.type,rows:sg.rows,cols:sg.cols,seats:sg.seats.slice(),locked:sg.locked.slice()},
      avoid:(c.avoid||[]).map(x=>x.slice()),praise:{...(c.praise||{})},teams:{n:tm.n,pts:tm.pts.slice()},goal:c.goal||'',board:c.board||'',_pos:goalPos(c)};}),
    checks:S.data.checks.filter(x=>!x.closed).map(x=>({id:x.id,classId:x.classId,kind:x.kind,title:x.title,date:x.date,done:x.done.slice(),closed:false,createdAt:x.createdAt}))};
}
function liveSendState(force){
  if(IS_STUDENT||!Live.open()||!S.data||S.realData) return;
  const snap=liveSnapshot(), j=JSON.stringify(snap);
  if(!force&&j===Live.lastJSON&&!Live.show) return;
  Live.lastJSON=j; Live.ch.postMessage({t:'state',s:snap,show:Live.show}); Live.show=null;
}
function liveSchedule(){ if(!Live.open()) return; clearTimeout(Live.t); Live.t=setTimeout(()=>liveSendState(false),120); }
function liveSendPing(){ if(Live.open()) Live.ch.postMessage({t:'ping',locked:!S.data||!!S.realData,pending:Live.pending.length}); }
function liveFlush(){
  if(IS_STUDENT||!S.data||S.realData) return;
  if(Live.pending.length){ const ops=Live.pending; Live.pending=[]; ops.forEach(applyOp); touch(); toast(`잠긴 동안 학생 창에서 누른 ${ops.length}건을 저장했습니다.`); }
  liveSendState(true);
}
function applyOp(op){
  if(!op||typeof op!=='object'||typeof op.k!=='string') return;
  if(op.k==='tap'){ S.data.settings.checkSelfTap=!!op.v; return; }
  const c=typeof op.cid==='string'&&getClass(op.cid); if(!c) return;
  const has=id=>typeof id==='string'&&c.students.some(s=>s.id===id&&!s.left);
  if(op.k==='chk'){
    const x=S.data.checks.find(k=>k.id===op.id&&k.classId===c.id&&!k.closed); if(!x||!has(op.sid)||!S.data.settings.checkSelfTap) return;
    const on=x.done.includes(op.sid); if(op.done&&!on) x.done.push(op.sid); if(!op.done&&on) x.done=x.done.filter(v=>v!==op.sid);
  }else if(op.k==='pr'){
    if(!has(op.sid)) return; c.praise=c.praise||{};
    const v=Math.max(0,(c.praise[op.sid]||0)+(op.d===1?1:-1)); if(v) c.praise[op.sid]=v; else delete c.praise[op.sid];
  }else if(op.k==='team'){
    const tm=teamsOf(c), i=op.i|0; if(i<0||i>=tm.n) return; tm.pts[i]=Math.max(0,tm.pts[i]+(op.d===1?1:-1));
  }else if(op.k==='goal'){ c.goal=String(op.v??'').slice(0,300); }
  else if(op.k==='board'){ c.board=String(op.v??'').slice(0,2000); }
}
function liveOnTeacher(m){
  if(!m||typeof m!=='object') return;
  if(m.t==='hello') return liveSendState(true);
  if(m.t!=='op') return;
  if(!S.data||S.realData){ if(Live.pending.length<1000) Live.pending.push(m.op); return liveSendPing(); }
  applyOp(m.op); touch(); liveSendState(true);
  const typing=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(S.display) renderDisplayMain(); else if(!typing&&!document.querySelector('.modal-back')&&['checks','classes','home'].includes(S.page)) renderMain();
}
setInterval(()=>{
  if(IS_STUDENT) return;
  if(Live.ch&&(!Live.win||Live.win.closed)) return liveClose(true);
  liveSendPing();
},2500);
window.addEventListener('pagehide',()=>{ if(!IS_STUDENT&&Live.ch) try{Live.ch.postMessage({t:'bye'});}catch{} });

/* ---------- 학생 창 쪽 ---------- */
const SL={ch:null,last:0,locked:false,pending:0,gone:false};
function studentBoot(){
  document.title='학생 화면 · 전담 수업 노트';
  window.addEventListener('hashchange',()=>location.reload());   // 선생님 창이 새 열쇠로 다시 열면 새로 연결
  applyTheme();
  if(!('BroadcastChannel' in window)) return studentWaiting('이 브라우저에서는 학생 창을 쓸 수 없습니다');
  SL.ch=new BroadcastChannel('jeondam-live-'+LIVE_TOKEN);
  SL.ch.onmessage=e=>studentOnMsg(e.data);
  studentWaiting('선생님 창과 연결하는 중…');
  const hello=()=>{ if(!S.data&&!SL.gone) SL.ch.postMessage({t:'hello'}); };
  hello(); setInterval(hello,1000); setInterval(studentStatus,2000);
}
function studentWaiting(msg){
  $('#modal-root').innerHTML='';
  $('#app').innerHTML=`<div class="center-wrap"><div class="auth card" style="text-align:center"><div class="auth-brand">전담 수업 노트 · 학생 화면</div>
    <h1 style="margin:12px 0">${esc(msg)}</h1><p class="muted">선생님 창에서 연 학생용 화면입니다. 저장은 선생님 창에서만 합니다.</p></div></div>`;
}
function studentData(s){
  return {settings:{theme:s.theme,praiseOn:!!s.praiseOn,checkSelfTap:!!s.checkSelfTap,autoLockMin:0},
    classes:(s.classes||[]).map(c=>({...c,memo:'',textbookId:'',seatHistory:[]})),checks:s.checks||[],
    textbooks:[],lessons:[],records:[],assessments:[],timetable:{}};
}
function studentStatus(){
  const el=$('#live-status'); if(!el) return;
  el.textContent = Date.now()-SL.last>20000 ? '선생님 창 응답 없음' : SL.locked ? `선생님 창 잠김${SL.pending?` · 저장 대기 ${SL.pending}`:''}` : '';
}
function studentOnMsg(m){
  if(!m||typeof m!=='object') return;
  SL.last=Date.now();
  if(m.t==='bye'){ SL.gone=true; S.data=null; S.display=null; return studentWaiting('선생님 창과 연결이 끊어졌어요'); }
  if(m.t==='ping'){ SL.locked=!!m.locked; SL.pending=m.pending|0; return studentStatus(); }
  if(m.t==='show'){ if(!S.display) return; if(getClass(m.classId)) S.display.classId=m.classId; if(m.tool) S.display.tool=m.tool; return renderDisplay(); }
  if(m.t!=='state'||!m.s) return;
  SL.locked=false; SL.pending=0;
  const first=!S.data||!S.display;
  S.data=studentData(m.s); applyTheme(m.s.theme);
  if(first||m.show){
    const sh=m.show||{}, cid=getClass(sh.classId)?sh.classId:(S.display&&getClass(S.display.classId)?S.display.classId:(S.data.classes[0]||{}).id);
    if(!cid) return studentWaiting('보여 줄 학급이 없습니다');
    if(first) S.display=newDisplayState(cid,sh.tool); else { S.display.classId=cid; if(sh.tool) S.display.tool=sh.tool; }
    return renderDisplay();
  }
  if(!dispClass()) S.display.classId=(S.data.classes[0]||{}).id;
  if(!dispClass()) return studentWaiting('보여 줄 학급이 없습니다');
  if(picking||['timer','pick','memo'].includes(S.display.tool)) return studentStatus();
  renderDisplay();
}


/* =====================================================================
   학년도: 새 학년 시작하기 · 지난 학년도 보관(앱 안) · 파일로 꺼내기

const clone = o => JSON.parse(JSON.stringify(o));

function archiveView(a,fromFile){
  if(!S.realData){ if(S.saveTimer) saveNow(); S.realData=S.data; }

  S.data={...R, ...v, settings:{...R.settings, periods:v.periods||R.settings.periods, praiseOn:false}, archives:R.archives, year:a.year};
  delete S.data.periods;
  S.viewYear=a.year; S.viewFromFile=!!fromFile; S.page='home'; S.classId=null; S.progClass=null; S.chkClass=null; S.chkId=null; S.asId=null; S.seatClass=null;
